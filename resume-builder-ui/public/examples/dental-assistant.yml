answerBlock: >
  A strong dental assistant resume leads with your chairside scope (4-handed dentistry,
  digital X-rays, impressions, sterilization) and your RDA/CDA credential up front, then
  proves patient volume with a daily-patient number — not just "assisted the dentist."

howToWrite:
  - "Lead with your credential (RDA, CDA, or state-specific certification) in the title or first line — dental offices filter on licensure before they read anything else."
  - "Name the exact procedures you supported chairside: restorations, extractions, sealants, impressions, digital radiography — 'assisted the dentist' tells a hiring manager nothing about your actual scope."
  - "State daily or weekly patient volume and how many dentists/operatories you supported (e.g. '25+ patients daily across 2 operatories') so the office can gauge pace fit."
  - "Name your practice management software (Dentrix, Eaglesoft, Open Dental) and your imaging system — these are searchable keywords, not generic phrases."
  - "Call out sterilization and OSHA/infection-control compliance explicitly; it is a licensing-adjacent requirement offices screen for, not a soft skill."
  - "If you're bilingual or trained in pediatric/behavior-management techniques, say so — many practices weight this heavily and it rarely appears on generic templates."

summaryExamples:
  - level: entry
    summary: >
      Recently certified dental assistant (RDA) trained in chairside assistance, digital
      radiography, and sterilization protocols. Comfortable supporting restorative and
      preventive procedures under dentist supervision, with a calm chairside manner for
      anxious patients.
  - level: mid
    summary: >
      RDA-certified dental assistant with 5+ years of chairside experience in general and
      cosmetic dentistry. Supports 2 dentists treating 25+ patients daily; skilled in digital
      radiography, impressions, and patient education on post-operative and preventive care.
  - level: senior
    summary: >
      Senior dental assistant with 8+ years across general, cosmetic, and pediatric practices,
      including 3 years training new hires on OSHA compliance and chairside protocol. Manages
      sterilization oversight and treatment coordination for a 3-operatory practice.

