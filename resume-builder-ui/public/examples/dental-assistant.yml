customFaqs:
  - question: "Do I need to be RDA or CDA certified to work as a dental assistant?"
    answer: "Requirements vary by state — some allow on-the-job training for basic duties, while expanded functions (like placing sealants or taking X-rays) usually require a state-recognized credential such as RDA or CDA. Put your specific credential and state on the resume so an office can confirm you meet their scope-of-practice rules."
  - question: "What software should a dental assistant list on a resume?"
    answer: "Name the practice management system (Dentrix, Eaglesoft, Open Dental) and the digital imaging/radiography system you've used. These are the tools offices search for by name, not generic terms like \"dental software.\""
  - question: "How do I show dental assistant experience without exact patient numbers?"
    answer: "Reconstruct a reasonable daily average from your typical schedule — for example, if you supported one dentist seeing patients every 30-45 minutes across an 8-hour day, that's roughly 12-16 patients. A conservative estimate beats no number at all."
  - question: "Should a dental assistant resume mention pediatric or bilingual skills?"
    answer: "Yes, if applicable. Pediatric behavior-management experience and bilingual ability (especially Spanish) are specifically screened for by many general and pediatric practices and rarely appear on generic templates, so naming them is a real differentiator."

