certifications:
  - Registered Dental Assistant (RDA) or Certified Dental Assistant (CDA)
  - X-Ray/Radiography Certification
  - CPR/BLS Certified
  - Coronal Polishing Certificate (where state-permitted)

mistakes:
  - mistake: "Writing \"assisted the dentist with procedures\" with no specifics"
    fix: "Name the actual procedures: \"Assisted with restorations, extractions, and sealant placement for 25+ patients daily.\" Vague duty phrasing reads the same for a 1-chair office and a 6-operatory practice."
  - mistake: "Omitting the RDA/CDA credential from the top of the resume"
    fix: "Put your licensure status in the title line or opening sentence — many offices legally cannot let an unlicensed assistant perform certain chairside tasks, so this is a hard filter, not a nice-to-have."
  - mistake: "Not naming the practice management or imaging software used"
    fix: "Name it: Dentrix, Eaglesoft, Open Dental, or the specific digital X-ray sensor system. \"Computer skills\" is not a keyword an ATS or office manager searches for."
  - mistake: "Leaving out sterilization/OSHA compliance"
    fix: "State it directly: \"Maintained sterilization protocols and OSHA compliance, passing [number] consecutive inspections.\" Infection control is a licensing-adjacent responsibility, not implied by the job title."

bulletRewrites:
  - weak: "Assisted the dentist with patient procedures"
    improved: "Provided chairside assistance for 2 dentists treating 25+ patients daily, supporting restorative, cosmetic, and preventive procedures"
    reason: "Adds provider count and daily patient volume, turning a generic duty into evidence of pace and scope."
  - weak: "Took X-rays of patients"
    improved: "Captured digital radiographs and intraoral photographs for [number] patients weekly with [X%] first-attempt diagnostic quality"
    reason: "Names the modality (digital, intraoral) and frames the work as a measurable quality outcome, not just a task; placeholder marks where the candidate fills in their real numbers."
  - weak: "Responsible for sterilizing instruments"
    improved: "Maintained sterilization protocols and OSHA compliance across [number] operatories, passing [number] consecutive infection-control inspections with no citations"
    reason: "Converts a routine duty into a compliance track record, which is what hiring dentists actually screen for."
  - weak: "Good with nervous patients"
    improved: "Reduced patient anxiety through clear chairside communication, contributing to a [X%] patient retention rate across a 2-dentist general practice"
    reason: "Replaces a subjective trait with a workplace outcome tied to retention, which reads as evidence rather than a self-assessment."

