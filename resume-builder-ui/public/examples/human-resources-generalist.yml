# Human Resources Generalist Resume Example
# Category: Corporate (Tier 2)

meta:
  slug: human-resources-generalist
  title: Human Resources Generalist
  metaTitle: "Free Human Resources Generalist Resume Example & Template (2026)"
  metaDescription: "HR generalist resume example covering recruitment, benefits, and employee relations."
  category: corporate
  priority: 0.7
  lastmod: "2026-09-23"

answerBlock: >
  A strong HR generalist resume names the employee headcount you supported, the HRIS platform
  you worked in (Workday, ADP), and a retention or time-to-fill metric you moved — not just
  "supported the full employee lifecycle" or "handled HR duties."

howToWrite:
  - "State the employee headcount and number of locations you supported — HR at a 50-person single-site office and a 300-person multi-site company draw on different skills, and hiring managers filter on it."
  - "Name the HRIS and applicant tracking system by product — Workday, ADP, iCIMS — not the category. \"HR systems\" tells a recruiter nothing; \"Workday\" tells them you can start using their system faster."
  - "Quantify recruitment and retention metrics: positions filled annually, average time-to-fill, or the turnover percentage change you drove. These are the numbers HR hiring managers compare across candidates."
  - "Separate the HR functions you actually owned — recruiting, benefits administration, employee relations, compliance — rather than a single line that says \"full-cycle HR,\" since generalist roles vary widely in which pieces they cover."
  - "If you handled investigations or compliance (FMLA, ADA, I-9), say so explicitly and note the outcome (zero findings, fully documented) — this is a trust signal HR hiring managers screen for early."
  - "Show one measurable culture or engagement outcome (reduced turnover, higher survey participation) alongside the administrative wins, since HR generalist roles are evaluated on both operations and impact."

summaryExamples:
  - level: entry
    summary: >
      HR generalist with coursework and internship experience in recruitment coordination,
      onboarding, and HRIS data entry. Comfortable supporting full-cycle recruiting and benefits
      administration tasks with strong attention to compliance and confidentiality.
  - level: mid
    summary: >
      HR generalist with 4+ years supporting the full employee lifecycle for a 150-person
      company. Manages full-cycle recruitment, onboarding, and benefits administration in ADP
      Workforce Now, reducing average time-to-fill from [X] to [Y] days.
  - level: senior
    summary: >
      SHRM-CP certified HR generalist with 6+ years supporting 300+ employees across 3 offices.
      Owns recruitment, employee relations, and compliance in Workday, reducing voluntary
      turnover [X%] through improved onboarding and structured engagement programs.

