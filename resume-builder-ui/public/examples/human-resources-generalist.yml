customFaqs:
  - question: "What's the difference between an HR generalist and an HR specialist resume?"
    answer: "An HR generalist resume shows breadth across recruiting, benefits, employee relations, and compliance for one organization. An HR specialist resume shows depth in one function — compensation, benefits, or recruiting — often across multiple organizations or as a dedicated role. Match your resume to which one you actually did."
  - question: "Do I need SHRM-CP or PHR certification to be an HR generalist?"
    answer: "It's not always required but is commonly preferred, especially past the entry level, and signals formal knowledge of employment law and HR practice. If you're studying for it, note the target exam date rather than leaving certification status blank."
  - question: "How do I show HR impact without exact turnover or time-to-fill numbers?"
    answer: "Reconstruct a reasonable estimate from records you likely still have access to — offer letters, an ATS export, or HRIS reports — rather than omitting the metric. If truly unavailable, a process change (\"built a structured onboarding checklist\") is a valid substitute for a hard number."
  - question: "Should an HR generalist resume mention specific compliance areas like FMLA or I-9?"
    answer: "Yes, if you handled them. Naming FMLA, ADA, or I-9 compliance directly signals you can be trusted with legally sensitive processes without oversight, which is one of the first things HR hiring managers screen for in a generalist role."

