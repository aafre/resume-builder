mistakes:
  - mistake: "Writing \"supported the full employee lifecycle\" with nothing underneath it"
    fix: "Break it into the actual functions: \"Managed full-cycle recruitment (50+ hires annually), benefits administration for 300 employees, and FMLA/ADA compliance.\" Each is a distinct keyword an ATS and a recruiter scan for separately."
  - mistake: "Omitting the HRIS platform by name"
    fix: "Say Workday or ADP, not \"HR software.\" A generalist role often requires ramp-up time in a specific system, and naming yours signals a faster start."
  - mistake: "Listing turnover reduction with no baseline"
    fix: "State both numbers: \"Reduced voluntary turnover from [X%] to [Y%]\" is verifiable; \"reduced turnover\" alone is not."
  - mistake: "Treating recruiting coordination and full HR generalist duties as interchangeable"
    fix: "A recruiting coordinator screens resumes and schedules interviews. An HR generalist also owns benefits, compliance, and employee relations. If your role was recruiting-only, say so precisely rather than implying broader generalist scope."

bulletRewrites:
  - weak: "Supported HR operations for the company"
    improved: "Supported HR operations for 300+ employees across 3 office locations, owning recruitment, benefits administration, and employee relations"
    reason: "Names the headcount, the number of locations, and the specific functions owned — turning a vague claim into a scoped set of responsibilities."
  - weak: "Managed recruitment process"
    improved: "Managed full-cycle recruitment filling 50+ positions annually with a [X]-day average time-to-fill, sourcing through iCIMS and LinkedIn Recruiter"
    reason: "Adds volume, a speed metric, and the specific tools used, which together let a hiring manager compare directly against their own recruiting benchmarks."
  - weak: "Handled employee relations issues"
    improved: "Investigated and resolved 50+ employee relations cases annually, maintaining full documentation and [zero escalations to legal]"
    reason: "Quantifies caseload and states an outcome (zero legal escalations) that signals thoroughness without disclosing confidential case details."
  - weak: "Administered benefits for employees"
    improved: "Administered health, 401(k), and PTO benefits for 500+ employees with [X%] enrollment accuracy, leading annual open enrollment achieving [X%] voluntary-benefit participation"
    reason: "Names the specific benefit types, the headcount, and two accuracy/participation metrics instead of describing benefits administration as a single undifferentiated task."

