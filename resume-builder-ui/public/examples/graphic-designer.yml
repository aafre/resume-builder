customFaqs:
  - question: "Where should a graphic designer put their portfolio link on a resume?"
    answer: "In the header, next to your name, email, and phone number — the same place a developer puts a GitHub link. A hiring reviewer for a design role typically opens the portfolio before reading the bullet points, so it needs to be the first thing they see, not buried in the summary."
  - question: "Should I list every design software I've used?"
    answer: "List the tools relevant to the role you're applying for, named individually — \"Photoshop, Illustrator, Figma\" rather than \"Adobe products.\" A long unfocused tool list reads as padding; a short, role-matched one reads as expertise."
  - question: "How do I show design impact if I can't share exact client numbers?"
    answer: "Use a bracketed placeholder for the real figure you can't disclose publicly (\"[X%] increase in engagement\") rather than a rounded number you can't defend, or describe the deliverable's scope instead: number of touchpoints, campaign channels, or team size supported."
  - question: "What's the difference between a branding-focused and a UI/UX-focused designer resume?"
    answer: "A branding resume should lead with identity systems, typography, and print/packaging work. A UI/UX-focused resume should lead with Figma, user flows, and product design collaboration with developers. Match the vocabulary and portfolio ordering to the specialization the job posting names."

