  category: creative
  priority: 0.7
  lastmod: "2026-09-23"

answerBlock: >
  A strong graphic designer resume leads with a portfolio link a reviewer can open in one
  click, names the specific software (Adobe Creative Suite, Figma) and design category
  (branding, packaging, UI) you work in, and lets 3-4 project results carry the case —
  not a list of adjectives like "creative" and "detail-oriented."

howToWrite:
  - "Put the portfolio URL in the header next to your name and email — it's the first thing a reviewer clicks, before reading a single bullet."
  - "Name your design category (branding, packaging, UI/UX, motion) in the summary — a designer resume that reads as generic 'graphic design' gets filtered against a specific opening."
  - "List software by product name (Photoshop, Illustrator, Figma, After Effects), not 'Adobe products' — ATS keyword matching and hiring managers both search the specific tool."
  - "Attach a measurable outcome to each project where one exists: client revenue, campaign reach, engagement lift — design work that shipped without a stated result reads as unfinished."
  - "Keep the resume itself well-designed but restrained — one accent color, clear hierarchy, no more than two fonts. The resume is itself a design sample."
  - "Order work samples in the portfolio to match the job posting's focus first (e.g. lead with branding work for a branding-agency opening) rather than chronologically."

summaryExamples:
  - level: entry
    summary: >
      Graphic design graduate with a portfolio spanning branding, social media, and print
      projects from coursework and freelance work. Proficient in Adobe Creative Suite and
      Figma. Comfortable taking a concept from mood board to final deliverable.
  - level: mid
    summary: >
      Graphic designer with 4+ years across branding and digital design, delivering
      campaigns for clients ranging from local startups to national retailers. Expert in
      Adobe Creative Suite and Figma with strong typography and layout skills. Portfolio
      at [website].
  - level: senior
    summary: >
      Senior graphic designer with 8+ years leading brand identity systems for enterprise
      clients, from concept through production-ready files. Mentors junior designers on
      typography and layout, and has led design for [number] award-recognized campaigns.
      Portfolio at [website].

