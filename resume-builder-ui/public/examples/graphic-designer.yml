mistakes:
  - mistake: "Burying or omitting the portfolio link"
    fix: "Put it in the resume header next to contact info, not at the bottom of a summary paragraph — a reviewer who has to hunt for it often doesn't."
  - mistake: "Describing design work with adjectives instead of specifics"
    fix: "Replace \"creative and detail-oriented\" with the actual deliverable and outcome: \"Designed brand identity system adopted across 50+ touchpoints.\""
  - mistake: "Listing \"Adobe products\" instead of naming each application"
    fix: "Name them individually: Photoshop, Illustrator, InDesign, After Effects — ATS and hiring managers filter on the specific tool, not the suite."
  - mistake: "No stated design category or specialization"
    fix: "State whether the focus is branding, packaging, UI/UX, or motion — a generalist resume reads weaker than a resume matched to the opening's specific need."

bulletRewrites:
  - weak: "Designed marketing materials for clients"
    improved: "Designed brand identity system for [industry] client generating $[amount] in first-year revenue, including logo, packaging, and 10+ marketing touchpoints"
    reason: "Names the deliverable set and ties it to a client outcome instead of a vague design task."
  - weak: "Created social media graphics"
    improved: "Created social media campaign graphics reaching [X]M impressions monthly across Instagram and LinkedIn, increasing engagement rate by [X%]"
    reason: "Adds channel, reach, and a measurable engagement outcome to a task that otherwise reads as routine production work."
  - weak: "Worked with the marketing team on branding"
    improved: "Partnered with marketing and copy teams to deliver a cohesive rebrand across web, print, and packaging for a [company size]-employee company"
    reason: "Shows cross-functional scope and the breadth of deliverables rather than an unspecified collaboration."
  - weak: "Responsible for print-ready files"
    improved: "Prepared print-ready files meeting vendor specifications for [number]+ projects annually, cutting reprint errors due to file issues by [X%]"
    reason: "Turns a production task into a reliability track record with a concrete, defensible metric."

