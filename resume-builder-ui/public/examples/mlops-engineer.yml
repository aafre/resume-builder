howToWrite:
  - "Open each role with the lifecycle stage you owned: training pipelines, promotion, serving or monitoring. A reader should be able to tell where a model goes after a data scientist hands it over."
  - "Put tools inside outcomes. \"Moved model promotion onto MLflow and ArgoCD, cutting release lead time from [X] days to [Y]\" says more than a skills line with both names on it."
  - "Give serving and cost numbers their context: the load, the hardware, and the quality or SLO you held. A cost cut with no quality context can read like a downgrade."
  - "Keep your work separate from the model's. Take credit for deployment reliability, rollback time and pipeline success rate, not for accuracy gains a data scientist produced."
  - "Show seniority through scope. Mid-level engineers run components and deliver scoped pipelines. Senior engineers own lifecycle reliability, incident response and cost trade-offs. Staff and lead engineers set platform standards that several teams adopt."
  - "Match the posting's stack honestly. The postings we sampled name different tools (Kubeflow, Airflow, Ray, KServe), so list the ones you have run in production and leave the rest off."

summaryExamples:
  - level: entry
    summary: >
      Backend engineer moving into MLOps, with [number] years of Python services and CI/CD
      work and one production model deployment. Packaged a forecasting model as a
      Docker service on Kubernetes, added monitoring for latency and input data, and cut
      manual release steps from [X] to [Y].
  - level: mid
    summary: >
      MLOps engineer with [number] years running training and serving pipelines on
      Kubernetes. Moved [number] models onto MLflow-tracked Kubeflow pipelines and
      canary releases, bringing experiment-to-production lead time down from [X] weeks
      to [Y] days.
  - level: senior
    summary: >
      Senior MLOps engineer who owns the model lifecycle for [number] production models,
      from promotion gates to on-call. Leads incident response and GPU cost decisions, and
      set the serving and monitoring standards [number] data science teams now build on.

