certifications:
  - "Certified Kubernetes Administrator (CKA): nice-to-have. One of the three MLOps postings we sampled lists it."
  - "Certified Kubernetes Application Developer (CKAD): nice-to-have, from the same posting."
  - "One cloud provider certification: nice-to-have, from the same posting. Pick the cloud you actually deploy on."

mistakes:
  - mistake: "Listing DevOps tools with no model lifecycle in sight"
    fix: "Kubernetes and Terraform alone read as a DevOps resume. Tie them to a model: what got trained, promoted, served or rolled back because of the setup you built."
  - mistake: "Claiming accuracy gains from someone else's model"
    fix: "If a data scientist improved the model, the accuracy number is theirs. Yours is the part that made it shippable: faster promotion, safer rollout, fewer failed runs."
  - mistake: "Calling every data shift a production defect"
    fix: "Say what your monitoring caught and what action followed. Drift that needed a retrain and a broken upstream feed are different failures, and a hiring manager will ask which one you handled."
  - mistake: "Cost savings with no load or quality context"
    fix: "State what stayed the same while cost went down: request volume, latency SLO, evaluation scores. Without that, a smaller GPU bill could just mean a worse service."
  - mistake: "Claiming every cloud platform from one deployment"
    fix: "List the cloud and services you ran in production. Touching a second provider once for a proof of concept belongs in an interview story, not the skills line."

bulletRewrites:
  - weak: "Worked with Kubernetes, Docker, MLflow and Airflow"
    improved: "Moved [number] models from notebook hand-offs to MLflow-tracked Airflow pipelines on Kubernetes, cutting experiment-to-production lead time from [X] days to [Y]"
    reason: "Turns a tool list into a lifecycle outcome. The same four tools now explain what changed for the models and how fast they reached production."
  - weak: "Deployed ML models to production"
    improved: "Served [model] on KServe with canary releases and automatic rollback, holding p95 latency under [X] ms at [Y] requests per second"
    reason: "Names the serving stack, the release safety mechanism and a latency number with its load, which is what a serving interview will probe."
  - weak: "Set up monitoring with Prometheus and Grafana"
    improved: "Added drift and data-quality alerts in Prometheus and Grafana for [number] production models, cutting the time to detect a broken input feed from [X] hours to [Y] minutes"
    reason: "Says what the monitoring watches and which failure it caught faster, instead of only naming the dashboard tools."
  - weak: "Reduced GPU costs"
    improved: "Right-sized the GPU serving fleet and batched requests with vLLM, lowering cost per 1,000 inferences by [X%] with the latency SLO and evaluation scores unchanged"
    reason: "Adds the method and the quality bar that held, so the saving can't be mistaken for a cheaper, worse service."

customFaqs:
  - question: "What's the difference between an MLOps engineer and an ML engineer resume?"
    answer: "An ML engineer resume centres on building and improving models: features, training, evaluation. An MLOps engineer resume centres on everything after that: promotion, serving, monitoring, rollback and running cost. If your bullets are mostly about accuracy, you are describing ML engineering. For the AI platform engineer title, see the role variant section on this page."
  - question: "How do I move from backend software engineering into MLOps?"
    answer: "Lead with the backend work that transfers: CI/CD, containers, on-call and running services under load. Then add at least one bullet where a model is the thing you shipped, even a small one, such as packaging a forecasting model as a service with monitoring. A reader looks for that bullet first."
  - question: "What metrics belong on an MLOps engineer resume?"
    answer: "Lifecycle metrics: experiment-to-production lead time, p95 latency or throughput at a stated load, cost per inference or training run, time to detect and recover from a failure, and failed pipeline runs. Use bracketed placeholders in your draft and fill them in from your own dashboards before you send it."
  - question: "Should I list model accuracy or deployment reliability on an MLOps resume?"
    answer: "Deployment reliability, unless you personally changed the model. Accuracy belongs to whoever trained it. You can mention it as context, for example that a model shipped without the evaluation scores dropping, but the achievement should be the rollout, rollback or monitoring work you did."
  - question: "How do I show MLflow and Kubernetes experience without a tool dump?"
    answer: "Name each tool inside the bullet where it did something: MLflow for tracking the runs you promoted, Kubernetes for the serving you ran. Keep the skills section short and make sure every tool in it also appears in at least one bullet."
  - question: "Do I need a certification to get an MLOps engineer job?"
    answer: "Not usually. Of the three MLOps postings we sampled, one listed CKA, CKAD or a cloud certification, and it listed them as nice-to-have. Production experience with serving and monitoring carries more weight, so add a certification only if you already hold it or the posting asks for it."

roleVariant:
  id: ai-platform
  title: AI Platform Engineer
  difference: >
    In the AI platform engineer postings we sampled, the customer is another engineering
    team. The job is to give them shared pieces they can build on, such as reusable
    templates, an agent runtime, context and tool handling, and evaluations, then track
    whether teams actually adopt them. An MLOps resume is organised around promoting and
    serving trained models. An AI platform resume is organised around reuse: how many
    teams build on what you made, and what it saved them. Kubernetes is not the defining
    skill here; one of the two postings is a TypeScript-first agent runtime.
  summary: >
    AI platform engineer who builds the shared agent runtime, evaluations and deployment
    templates that [number] product teams use to ship GenAI features, with usage and cost
    reported per team.
  bullets:
    - "Built a shared agent runtime adopted by [number] teams, cutting time to first production deployment from [X] weeks to [Y]"
    - "Ran a shared evaluation service across [number] releases, catching [regression types] before launch"
    - "Added per-team usage and cost reporting, reducing cost per successful workload by [X%]"
    - "Designed context management for long-running agents, raising task completion from [X%] to [Y%] within the same token and latency budget"
    - "Published deployment templates and docs for RAG and agent apps, growing active platform teams from [X] to [Y] while support tickets fell by [Z%]"
  faqs:
    - question: "What is the difference between an AI platform engineer and an MLOps engineer resume?"
      answer: "An MLOps resume shows models moving from training to reliable serving. An AI platform resume shows shared infrastructure, such as an agent runtime, evaluations and templates, that other engineering teams adopt. Lead with adoption and reuse on a platform resume, and with lifecycle reliability on an MLOps one."
    - question: "How do I show platform adoption across engineering teams?"
      answer: "Count teams or apps that actively build on the platform, not everyone with access to it. Pair the count with what adoption saved them, such as time to first deployment or fewer support tickets. One chatbot used by one team is an app, not a platform."

