  category: operations
  priority: 0.7
  lastmod: "2026-09-22"

answerBlock: >
  A strong receptionist resume leads with the phone and visitor volume you handled daily
  (calls, check-ins, scheduling), names the specific phone and scheduling systems you used,
  and shows you can keep a front desk calm during a busy walk-in rush — not just "greeted
  visitors."

howToWrite:
  - "Open with a summary that states your front-desk setting (medical, legal, corporate) and years of experience — a hiring manager scanning 40 resumes decides in seconds whether your environment matches theirs."
  - "List the specific phone system and scheduling software you've used (multi-line, Outlook, EHR check-in) by name — recruiters and ATS keyword filters look for the tool, not the word 'phones.'"
  - "Quantify visitor and call volume per shift (e.g. '80+ patients daily,' '150+ calls'). A receptionist resume with no numbers reads the same for a 5-person office and a 200-person lobby."
  - "Separate front-desk duties from any admin support you did — filing, mail, calendar management for executives — so the resume shows range beyond just answering phones."
  - "If you handle confidential records (medical, legal, HR), say so explicitly and name any privacy training (HIPAA) — it signals trust before the interview."
  - "Keep it to one page. Receptionist hiring managers skim; a second page of generic office tasks works against you."

summaryExamples:
  - level: entry
    summary: >
      Organized and personable recent graduate seeking a front desk role. Comfortable managing
      a multi-line phone system, scheduling appointments, and greeting visitors professionally.
      Strong Microsoft Office skills and a calm, welcoming manner under pressure.
  - level: mid
    summary: >
      Receptionist with 3+ years of experience managing front desk operations in a fast-paced
      professional office. Handles 100+ calls and 50+ visitors daily using multi-line phone
      systems and electronic scheduling. Known for keeping the front desk organized during
      high-volume periods.
  - level: senior
    summary: >
      Senior receptionist with 8+ years across legal and medical front-desk settings, including
      2 years training new hires on phone and check-in procedures. Manages scheduling for
      12+ staff, vendor coordination, and confidential document handling with zero compliance
      incidents.

