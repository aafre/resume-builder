customFaqs:
  - question: "What software should a receptionist list on their resume?"
    answer: "Name the specific systems: the phone system (multi-line, VoIP), the scheduling tool (Outlook, Calendly, or an EHR check-in system for medical offices), and Microsoft Office. Listing the actual product names, not just \"phones\" or \"scheduling,\" is what an ATS and a hiring manager scan for."
  - question: "How do I show receptionist experience without call or visitor numbers?"
    answer: "Estimate conservatively from memory rather than omitting the metric entirely — \"managed a busy multi-line phone system\" is weaker than \"handled 100+ calls daily,\" and most receptionists can reconstruct a reasonable daily average from their shift length and role."
  - question: "Should a receptionist resume mention HIPAA or confidentiality?"
    answer: "Yes, if the role touched patient, legal, or HR records. Naming HIPAA training or a confidentiality track record signals trustworthiness before the interview — it's one of the first things medical and legal office managers screen for."
  - question: "Is one page enough for a receptionist resume with 8+ years of experience?"
    answer: "Usually yes. Receptionist hiring managers are screening for front-desk fit, not a full career history — keep the most recent and most relevant roles detailed, and compress earlier front-desk jobs into one or two lines each."
  - question: "What's the difference between a medical receptionist and a corporate receptionist resume?"
    answer: "A medical receptionist resume should emphasize EHR check-in systems, insurance verification, and HIPAA compliance. A corporate receptionist resume should emphasize visitor and vendor management, multi-executive calendar coordination, and conference room scheduling. Match the vocabulary to the setting you're applying to."

