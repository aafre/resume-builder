mistakes:
  - mistake: "Writing \"answered phones and greeted people\" with no numbers"
    fix: "State the actual daily volume: \"Managed multi-line phone system handling 150+ calls daily.\" The number is what separates a quiet office from a 12-attorney law firm."
  - mistake: "Naming the job title but not the setting"
    fix: "Say whether it was a medical, legal, or corporate front desk — the software, pace, and confidentiality requirements differ enough that recruiters filter on it."
  - mistake: "Listing \"customer service\" as the only skill"
    fix: "Break it into what you actually did: visitor check-in, scheduling, mail handling, phone triage — each is a keyword an ATS scans for separately."
  - mistake: "Omitting the specific scheduling or EHR software used"
    fix: "Name it: Outlook, Epic, Calendly. A resume that only says \"scheduling software\" reads as if you've never used a named tool."

bulletRewrites:
  - weak: "Answered phones and greeted visitors"
    improved: "Managed multi-line phone system handling 150+ calls daily while greeting and directing 75+ visitors in a 12-attorney law office"
    reason: "Adds the specific volume and setting, turning a generic duty into evidence you can handle a high-traffic professional front desk."
  - weak: "Responsible for scheduling appointments"
    improved: "Scheduled and confirmed appointments for [number] providers using [scheduling software], reducing no-shows by [X%] through proactive reminder calls"
    reason: "Names the tool and frames scheduling as a result (fewer no-shows), not just a task — placeholders mark where the candidate fills in their real numbers."
  - weak: "Handled office supplies and mail"
    improved: "Managed office supply inventory and incoming/outgoing mail for a 50-person office, cutting supply costs by [X%] through consolidated ordering"
    reason: "Shows ownership of a process with a measurable outcome instead of listing a task with no context for its scale."
  - weak: "Good with people and organized"
    improved: "Maintained [X%] positive visitor feedback while managing a waiting area serving 80+ patients daily across two providers"
    reason: "Replaces a subjective self-description with a verifiable outcome tied to the actual front-desk workload."

