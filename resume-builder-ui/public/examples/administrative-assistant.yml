answerBlock: >
  A strong administrative assistant resume names the specific executives or team size you
  support, the calendar and expense tools you use daily (Outlook, Concur, SAP), and a dollar
  or hour figure tied to what you kept running — not just "organized and detail-oriented."

howToWrite:
  - "Lead with who you supported and at what scale — 1 executive vs. 5, or a 50-person office vs. a 12-attorney firm — because the skill set for each is different and hiring managers filter on it."
  - "Name the calendar, expense, and travel tools by product (Outlook, Concur, SAP, Google Workspace), not the generic category — ATS keyword filters and recruiters both scan for the tool."
  - "Quantify the volume you managed: meetings scheduled weekly, expense dollars processed monthly, or documents filed — a number is what separates 'kept the office organized' from a verifiable track record."
  - "Separate executive support duties (calendar, travel, board prep) from general office admin (supplies, filing, phones) so the resume shows the actual mix of responsibility you held."
  - "If you handled confidential material — HR files, board documents, patient records — say so explicitly; discretion is a named qualification for this role, not an assumed trait."
  - "Keep it to one page unless you're at the executive assistant level with 10+ years; admin hiring managers screen fast and reward a resume that's easy to scan."

summaryExamples:
  - level: entry
    summary: >
      Organized administrative professional with strong Microsoft Office skills and experience
      coordinating schedules and correspondence in a fast-paced office. Comfortable managing
      calendars, data entry, and day-to-day administrative requests with accuracy and discretion.
  - level: mid
    summary: >
      Administrative assistant with 4+ years supporting department managers and office
      operations. Manages calendars, travel coordination, and expense reporting for a 20-person
      team using Outlook and Concur. Known for anticipating needs before they're asked.
  - level: senior
    summary: >
      Executive administrative assistant with 8+ years supporting C-level leadership across
      finance and professional services. Manages calendars, travel, and $200K+ in monthly
      expense processing for a 15-person leadership team with [zero compliance incidents].

