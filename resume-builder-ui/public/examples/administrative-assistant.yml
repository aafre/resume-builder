mistakes:
  - mistake: "Writing \"managed calendars\" with no scale"
    fix: "State who and how many: \"Managed calendars for 3 C-level executives, scheduling 50+ meetings weekly.\" The scale is what tells a hiring manager whether you've handled their volume."
  - mistake: "Listing software categories instead of product names"
    fix: "Say Outlook and Concur, not \"scheduling and expense software\" — ATS filters and recruiters both search on the named tool."
  - mistake: "Treating executive support and general office admin as the same skill"
    fix: "Separate them: board-meeting prep and travel booking for executives is a different (and more senior) skill set than answering phones and ordering supplies — show both if you did both."
  - mistake: "Omitting confidentiality experience"
    fix: "If you handled HR files, legal documents, or board materials, say so directly — discretion with sensitive information is a screened-for qualification, not something to imply."

bulletRewrites:
  - weak: "Managed executive calendars and scheduling"
    improved: "Managed calendars for 3 C-level executives, scheduling 50+ meetings weekly across conflicting time zones"
    reason: "Names the number of executives and weekly volume, turning a duty into evidence of scale you can repeat for a new employer."
  - weak: "Handled travel arrangements"
    improved: "Coordinated domestic and international travel for a 15-person leadership team using [travel platform], booking [number]+ trips per quarter with [zero missed connections]"
    reason: "Names the tool and frequency; placeholders mark where the candidate fills in their real trip count."
  - weak: "Processed expense reports"
    improved: "Processed $200K+ in monthly expense reports with [X%] accuracy, reconciling against budget before month-end close"
    reason: "Converts a routine task into a dollar figure and an accuracy standard an employer can compare against their own volume."
  - weak: "Responsible for office supplies and filing"
    improved: "Reduced office supply costs [X%] by renegotiating vendor contracts, while maintaining a document retrieval system rated [X%] faster by staff surveys"
    reason: "Ties two routine tasks to measurable outcomes (cost, speed) instead of listing them as bare responsibilities."

