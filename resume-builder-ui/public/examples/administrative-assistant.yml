customFaqs:
  - question: "What's the difference between an administrative assistant and an executive assistant on a resume?"
    answer: "An administrative assistant resume typically shows support for a department or general office operations — scheduling, filing, phones. An executive assistant resume shows support for one or a few senior leaders — calendar gatekeeping, board meeting prep, travel for executives, and expense authority. If you did both, show the progression."
  - question: "Should I list every software program I've used as an admin?"
    answer: "List the ones the job posting or your target employer actually uses — Outlook and Concur for corporate roles, an EHR system for medical offices, SAP for larger enterprises. A long generic list of every tool you've ever touched reads as padding rather than fit."
  - question: "How do I quantify admin work that doesn't have obvious numbers?"
    answer: "Almost every admin task has a countable unit: meetings scheduled per week, calls handled per day, documents filed per month, dollars processed, or percentage improvement in a process you touched. Reconstruct a conservative estimate from memory rather than leaving the bullet as a bare task."
  - question: "Is a one-page resume enough for an administrative assistant with 10+ years of experience?"
    answer: "Usually, yes, unless you're applying at the executive assistant or office manager level with progressively more responsibility to show. Compress early-career admin roles into one or two lines and give full detail only to the most recent, most relevant positions."

