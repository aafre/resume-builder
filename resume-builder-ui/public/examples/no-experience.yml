mistakes:
  - mistake: "Leaving the experience section blank or writing 'N/A'"
    fix: "List unpaid work instead: volunteering, caregiving, freelance gigs, organizing a fundraiser. Give it a title, dates, and bullets exactly like a paid job — a blank section reads as 'nothing to say,' not 'no experience.'"
  - mistake: "Opening with an apology or an objective statement"
    fix: "Cut 'seeking an opportunity to gain experience' entirely. Replace it with two lines describing what you can actually do, based on your strongest skills — an apology wastes the first thing a recruiter reads."
  - mistake: "Listing only paid jobs and treating caregiving or volunteering as unmentionable"
    fix: "Unpaid work is still work. A stay-at-home parent who managed a household budget has real budgeting experience; a volunteer coordinator has real scheduling and people-management experience. Name it plainly."
  - mistake: "Using a chronological layout when there's nothing to put in chronological order"
    fix: "Lead with a Skills section, then a combined Experience section (paid and unpaid together, most relevant first) rather than forcing a timeline that highlights the gap."

bulletRewrites:
  - weak: "No work experience, but a fast learner and hard worker"
    improved: "Completed a self-paced Google Workspace certificate in [X weeks] while managing [volunteer role/household responsibility], demonstrating the ability to learn new systems independently"
    reason: "Replaces a claim with evidence — the certificate and the context around it prove 'fast learner' instead of just asserting it."
  - weak: "Helped out at community food bank sometimes"
    improved: "Coordinated weekly meal deliveries for 15+ households as a volunteer at [organization name], managing a rotating schedule of 8 volunteers"
    reason: "Turns a vague, occasional-sounding activity into a scoped role with a volunteer count and a coordination responsibility — the kind of detail a scheduling or operations role screens for."
  - weak: "Took care of family member for several years"
    improved: "Managed medical appointments, medication schedules, and a [$X] monthly household budget as full-time caregiver for [X years], coordinating with [number] healthcare providers"
    reason: "Reframes caregiving with the same vocabulary as a paid coordination role — appointments, budget, provider coordination — so a hiring manager reads transferable operational skill, not a resume gap."
  - weak: "Babysat and did odd jobs for neighbors"
    improved: "Provided paid childcare and household support for [number] families on a recurring basis, managing schedules and handling payment independently"
    reason: "Names the gig work as self-managed, recurring, and financial — signals reliability and independence rather than sounding like one-off favors."

customFaqs:
  - question: "How do I fill out a resume with absolutely no work experience?"
    answer: "List anything you did consistently that had real responsibility, even unpaid: volunteering, caregiving, running a household, organizing an event, freelance gigs found through word of mouth or an app. Give each one a title, a timeframe, and 2-3 bullets describing what you actually did, exactly like a paid job entry."
  - question: "Should I mention that I have no work experience?"
    answer: "No. Don't apologize for it or draw attention to the gap in your summary. Let the resume speak through what you've done — skills, volunteer work, certificates — rather than opening with what you haven't done."
  - question: "Does volunteer work count as experience on a resume?"
    answer: "Yes. List it in your experience section with the same structure as a paid job: organization name, your role, dates, and bullet points describing your responsibilities and any measurable outcomes. Many hiring managers weigh consistent volunteer work as seriously as a part-time job."
  - question: "I'm returning to work after years as a caregiver — how do I explain the gap?"
    answer: "Don't frame it as a gap — frame it as a role. 'Full-time Caregiver' is a legitimate experience entry with real responsibilities: budgeting, scheduling, coordinating with providers, managing multiple people's needs at once. List it with dates and bullets like any other job."
  - question: "What resume format is best when you have no traditional work history?"
    answer: "Lead with a skills-based summary, then a Skills section, then a combined Experience section that includes both paid and unpaid work in order of relevance rather than strict chronology. Keep Education below Experience unless you're a current student."

