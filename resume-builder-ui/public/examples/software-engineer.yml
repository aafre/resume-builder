customFaqs:
  - question: "Should a software engineer resume list every programming language I know?"
    answer: "No. List the languages you can defend in a live coding interview, ordered by proficiency or by relevance to the job posting, not alphabetically. A resume padded with unfamiliar languages gets exposed in the first technical question."
  - question: "How do I show project scale without real production metrics?"
    answer: "Use bracketed placeholders like [X%] or [number] in your draft, then fill them in with your actual numbers before sending — pulling from monitoring dashboards, PR history, or team retros. Never invent a number you can't explain in an interview."
  - question: "What's the difference between a software engineer and full-stack developer resume?"
    answer: "A software engineer resume typically emphasizes system design, algorithms, and production-scale ownership across the stack. A full-stack developer resume leans more toward shipping features end-to-end — UI, API, and database — for a specific product. Match the framing to the job title in the posting."
  - question: "Should I include a GitHub link on my software engineer resume?"
    answer: "Yes, if it has real, recent activity — a personal project, open-source contributions, or work you can walk through. An inactive or empty GitHub profile is worse than no link at all, since a hiring manager who clicks through and finds nothing loses confidence."
  - question: "How many bullet points should each job have on a software engineer resume?"
    answer: "3-5 for recent, relevant roles; 1-2 for older or less relevant ones. Each bullet should earn its place with a specific technology and outcome — a long list of generic bullets is weaker than a short list of measurable ones."

