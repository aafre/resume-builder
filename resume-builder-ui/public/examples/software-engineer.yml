mistakes:
  - mistake: "Listing every language and framework you've ever touched"
    fix: "Keep the skills section to what you can discuss confidently in a live coding round — an interviewer will pick the item you list and ask you to go deep on it."
  - mistake: "Writing bullets that describe assigned tasks instead of outcomes"
    fix: "Replace \"worked on the checkout flow\" with what changed because of your work: \"rebuilt the checkout flow, reducing cart abandonment by [X%].\""
  - mistake: "No scale numbers anywhere on the resume"
    fix: "Add at least one per major project: requests/day, uptime, latency, or user count — it's the fastest way to signal production experience versus tutorial-level work."
  - mistake: "Burying the tech stack in a paragraph instead of the bullet"
    fix: "State the stack inline in the achievement bullet (\"using React and Node.js\") so an ATS keyword scan and a human skim both catch it in the same sentence."
  - mistake: "No GitHub, portfolio, or live project link"
    fix: "Add one if you have active, presentable work — for engineers, a real repo is stronger evidence than another line of prose."

bulletRewrites:
  - weak: "Worked on the backend API"
    improved: "Designed and implemented a RESTful API in Node.js and Express serving [number]+ daily requests with [X%] uptime, documented with OpenAPI/Swagger"
    reason: "Names the stack, adds a scale placeholder, and shows the work was production-grade and documented — not a tutorial exercise."
  - weak: "Helped improve site performance"
    improved: "Reduced page load time by [X%] through code splitting, lazy loading, and CDN caching, measured via Lighthouse before and after"
    reason: "Converts a vague claim into a specific technique plus a measurement method, which is exactly what a performance-focused interview question probes."
  - weak: "Participated in code reviews"
    improved: "Led code reviews for a [number]-person team, introducing a lint/type-check gate that reduced production bugs by [X%] over [timeframe]"
    reason: "Shows initiative (introduced a process) and ties it to an outcome, distinguishing participation from ownership."
  - weak: "Fixed bugs and maintained the application"
    improved: "Resolved [number] production incidents during on-call rotation, reducing mean time to resolution from [X] to [Y] by building a shared runbook"
    reason: "Reframes routine maintenance as measurable incident-response ownership, which senior and staff-level postings specifically screen for."

