# High School Student Resume Example
# Category: Entry Level (Tier 4)

meta:
  slug: high-school-student
  title: High School Student
  metaTitle: "Free High School Student Resume Example & Template (2026)"
  metaDescription: "High school student resume example for part-time jobs and volunteer experience."
  category: entry-level
  priority: 0.7
  lastmod: '2026-09-23'

answerBlock: >
  A first high school resume proves reliability, not job history — attendance, coursework,
  a part-time job or volunteer role, and one adult reference who can vouch for you.
  Name specific responsibilities (cash handling, tutoring younger students, event setup)
  instead of "hardworking and responsible," since anyone can claim those traits.

howToWrite:
  - "Skip the objective statement and write a 2-3 sentence summary naming your grade, GPA if 3.0+, and the type of role you want — employers hiring teens screen for reliability signals fast."
  - "List volunteer work, babysitting, lawn care, or any self-employed work the same way you'd list a job — title, dates, and what you actually did. Unpaid counts."
  - "Add school clubs and sports with a real responsibility, not just membership: team captain, club founder, event organizer. 'Member of X club' says nothing an employer can use."
  - "Include one reference-worthy adult relationship (teacher, coach, volunteer coordinator) even if you don't list contact info directly — mention 'available upon request' so an employer knows references exist."
  - "State your availability explicitly (weekends, after 3pm weekdays, summers) — for part-time teen hiring, schedule fit often matters as much as the resume content itself."
  - "Keep it to one page with generous white space. A packed page of filler bullets reads worse than a clean half-page with 3-4 strong ones."

summaryExamples:
  - level: entry
    summary: >
      High school sophomore with strong academic standing and no formal work experience yet,
      seeking a first part-time role. Reliable and available after school and weekends.
      Active in student council and comfortable with basic Microsoft Office and Canva.
  - level: mid
    summary: >
      High school junior with over a year of volunteer and self-employed experience, including
      a lawn care business with 8 regular clients and weekly library volunteering. Elected
      student council representative for 400+ classmates. Seeking part-time retail or food
      service work with flexible weekend availability.

