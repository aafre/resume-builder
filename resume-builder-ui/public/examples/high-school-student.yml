mistakes:
  - mistake: "Writing a full 'work history' style resume with padded phrases"
    fix: "Keep it short and specific: what you did, for whom, and for how long. A first resume doesn't need to look like a 10-year-career resume — half a page of real detail beats a full page of filler."
  - mistake: "Leaving off unpaid work like babysitting, lawn care, or volunteering"
    fix: "List it exactly like a job — title, dates, responsibilities. Employers hiring teens for a first job care that you showed up reliably, not whether you were paid."
  - mistake: "No mention of availability or schedule constraints"
    fix: "State it directly: 'available weekends and after 3pm weekdays.' For part-time and seasonal hiring, this is often the first thing a manager checks."
  - mistake: "Listing 'hardworking' and 'team player' with nothing to back it up"
    fix: "Replace the adjective with the evidence: a specific responsibility, a number, or a role title that demonstrates it instead of claiming it."

bulletRewrites:
  - weak: "Helped at the library"
    improved: "Volunteered as a Library Assistant, shelving 100+ books daily and supporting a children's reading program serving 20+ kids weekly during summer months"
    reason: "Turns a vague 'helped' into a named role with a daily task volume and a specific program served."
  - weak: "Part of student council"
    improved: "Elected as Junior Class Representative for 400+ students; organized a homecoming dance attended by 500 students in coordination with school administration"
    reason: "Adds the election, the scale represented, and one concrete event with attendance — evidence of trust and follow-through, not just membership."
  - weak: "Did lawn care for neighbors"
    improved: "Built a self-employed lawn care client base of 8 regular customers, managing scheduling and billing independently using Square invoicing"
    reason: "Frames informal work as a small business with real operational responsibilities (scheduling, billing), which reads as initiative to an employer."
  - weak: "Started an environmental club"
    improved: "Founded a school environmental club, growing membership to [X] students and organizing a campus recycling drive that collected [Y]+ pounds of recyclable materials"
    reason: "Shows founding initiative plus a measurable outcome, not just that a club exists — placeholders mark where the real membership and collection totals go."

