customFaqs:
  - question: "Which certifications should go at the top of a registered nurse resume?"
    answer: "Your active RN license (with state), BLS, and ACLS at minimum — these are frequently mandatory ATS filters for hospital systems. Add PALS for pediatric or ED roles and TNCC or CCRN if the posting mentions trauma or critical care specifically."
  - question: "How do I list EMR experience if I've only used one system?"
    answer: "List it explicitly by name (\"Epic EMR documentation\") rather than the generic \"electronic health records.\" If you're applying to a hospital using a different system, note that you're a fast learner on new EMR platforms in your cover letter, not the resume."
  - question: "Should a new grad RN resume include clinical rotations?"
    answer: "Yes — list rotation units (ICU, med-surg, ER) the same way you'd list work experience, including the EMR system used and any specific skills practiced (IV starts, wound care, medication administration), since new grads are evaluated on rotation breadth."
  - question: "What patient-to-nurse ratio should I state if it varied by shift?"
    answer: "Give a realistic range (\"5-7 patients per shift\") rather than a single number or omitting it — the range communicates both your typical and peak acuity load, which is exactly what a hiring manager is trying to assess."
  - question: "Is a two-page nursing resume acceptable?"
    answer: "Yes, more than for most roles — nurses with 10+ years, multiple units, and several certifications often need two pages to list mandatory credentials, unit history, and quality metrics without cutting anything a hospital ATS screens on."

