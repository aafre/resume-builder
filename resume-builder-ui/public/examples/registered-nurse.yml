mistakes:
  - mistake: "Leaving certifications for the bottom of the resume"
    fix: "Move RN license, BLS, ACLS (and PALS/TNCC if relevant) into the header or a dedicated line near the top — many hospital ATS systems screen on these before a human ever reads the resume."
  - mistake: "Writing \"provided patient care\" with no unit context"
    fix: "Name the unit and acuity: \"provided direct care in a Level I trauma center ED\" or \"managed 5-7 patients on a 32-bed med-surg unit\" tells a nurse manager your pace and specialty instantly."
  - mistake: "Omitting the EMR system"
    fix: "Always name it — Epic, Cerner, Meditech. Recruiters filter for the specific system the hospital uses, since retraining time is a real hiring cost."
  - mistake: "No quality or safety metric anywhere on the resume"
    fix: "Add one: fall rate reduction, HCAHPS percentile, medication accuracy rate, or hand-hygiene compliance improvement — nursing is evaluated on patient-safety outcomes."

bulletRewrites:
  - weak: "Took care of patients on the floor"
    improved: "Managed care for 5-7 patients per shift on a 32-bed medical-surgical unit, administering IV medications via Epic MAR and monitoring vital signs"
    reason: "Names the unit, patient load, and EMR system — the three details a nurse manager screens for first."
  - weak: "Gave medications to patients"
    improved: "Administered [number]+ medications per shift following physician orders with [X%] documented accuracy, using Epic's barcode medication administration workflow"
    reason: "Turns a routine task into a measurable accuracy claim tied to a named system, with placeholders where real figures belong."
  - weak: "Helped train new nurses"
    improved: "Precepted 4 new graduate nurses through a 12-week hospital orientation program, with [number]/4 retained past the first year"
    reason: "Quantifies both the mentoring scope and its outcome, which is what charge-nurse and lead-RN postings specifically screen for."
  - weak: "Worked to reduce patient falls"
    improved: "Participated in a unit-based fall-prevention initiative that reduced fall rates by [X%] over [timeframe] through hourly rounding and updated risk assessments"
    reason: "Frames the work as a quality-improvement outcome with a timeframe, matching how hospitals report and reward safety metrics."

