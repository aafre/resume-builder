# Registered Nurse Resume Example
# Category: Healthcare (Tier 3)

meta:
  slug: registered-nurse
  title: Registered Nurse
  metaTitle: "Free Registered Nurse Resume Example & Template (2026)"
  metaDescription: "Registered nurse resume example with clinical skills and patient care experience. ATS-optimized nursing resume."
  category: healthcare
  priority: 0.8
  lastmod: "2026-09-22"

answerBlock: >
  A strong RN resume names the unit and patient-to-nurse ratio you worked, the EMR system
  (Epic, Cerner) by name, every mandatory certification (BLS, ACLS, PALS) up front, and at
  least one outcome metric — fall rate, HCAHPS score, or medication accuracy — because
  nurse recruiters filter on certifications and unit type before they read a single bullet.

howToWrite:
  - "Lead with your unit and setting — ICU, ER, med-surg, telemetry — in the summary. Nursing is specialized enough that \"registered nurse\" alone tells a recruiter nothing about whether you fit their opening."
  - "List every mandatory certification (RN license state, BLS, ACLS, PALS) near the top, not buried at the bottom. Many hospital ATS systems auto-reject resumes missing a required certification keyword."
  - "Name your EMR system explicitly — Epic, Cerner, Meditech. Charting speed and accuracy in a specific system is a real, screened-for skill, not a footnote."
  - "State your patient load or ratio per shift (e.g. \"5-7 patients on a 32-bed med-surg unit\"). It tells a nurse manager your acuity level and pace immediately."
  - "Add at least one quality or safety metric tied to your unit — fall rate reduction, medication error rate, HCAHPS/patient satisfaction percentile — nursing resumes are evaluated on patient-safety outcomes, not just tasks performed."
  - "If you've precepted or mentored new grads, say how many and over what period — hospitals weight this heavily for charge-nurse and lead roles."

summaryExamples:
  - level: entry
    summary: >
      Newly licensed RN, BSN, with clinical rotations in med-surg, ICU, and emergency
      settings. ACLS and BLS certified. Comfortable with Epic EMR from clinical placements
      and eager to bring strong patient assessment and communication skills to a
      structured new-graduate residency program.
  - level: mid
    summary: >
      Registered nurse with 4+ years of experience in medical-surgical and telemetry care.
      Manages 5-7 patients per shift on a 32-bed unit, documents in Epic EMR, and
      contributed to a unit quality-improvement initiative that reduced fall rates.
      BLS, ACLS certified.
  - level: senior
    summary: >
      Charge nurse with 8+ years in emergency and critical care, including 3 years
      precepting new graduate nurses through a hospital residency program. ACLS, PALS,
      and TNCC certified. Track record of maintaining zero medication errors while
      overseeing a 6-nurse team during evening shifts.

