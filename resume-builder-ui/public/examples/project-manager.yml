# Project Manager Resume Example
# Category: Corporate (Tier 2)

meta:
  slug: project-manager
  title: Project Manager
  metaTitle: "Free Project Manager Resume Example & Template (2026)"
  metaDescription: "Project manager resume example with leadership and methodology expertise. Includes PMP-ready format."
  category: corporate
  priority: 0.8
  lastmod: "2026-09-23"

answerBlock: >
  A strong project manager resume names the budget size and team headcount you owned, the
  methodology you ran (Agile, Waterfall, or hybrid), and a delivery outcome — on-time
  percentage, budget variance, or risks mitigated — not just "managed projects and led teams."

howToWrite:
  - "Lead with the budget and team size you owned — a $500K project with 5 people and a $10M portfolio with 25 people require different skills, and hiring managers screen on scale."
  - "Name the methodology explicitly: Agile/Scrum, Waterfall, or hybrid. A PM resume that never says which one leaves the reader guessing whether you can run standups or a phase-gated plan."
  - "Quantify delivery performance: on-time percentage, budget variance (under/over), or number of risks identified and mitigated. \"Successfully managed projects\" with no delivery metric is the single most common weak PM bullet."
  - "Show stakeholder scope — how many departments, vendors, or time zones you coordinated — since cross-functional complexity is often the actual hard part of the job, not the Gantt chart."
  - "List your certification status precisely: PMP-certified, PMP-eligible, or working toward it. Many postings filter on PMP as a hard requirement, so ambiguity here costs interviews."
  - "Separate individual delivery wins (this project came in under budget) from leadership wins (mentored 3 PMs, built a PMO process) — senior PM roles screen for the second category specifically."

summaryExamples:
  - level: entry
    summary: >
      Detail-oriented associate project manager with experience supporting project schedules,
      status reporting, and stakeholder communication on cross-functional teams. Familiar with
      Agile ceremonies and Jira; working toward PMP certification.
  - level: mid
    summary: >
      Project manager with 4+ years delivering technology and process-improvement projects
      with budgets up to $2M. Runs Agile sprint planning and retrospectives for teams of 8-12,
      with a [X%] on-time delivery record across 15 completed projects.
  - level: senior
    summary: >
      PMP-certified senior project manager with 8+ years delivering $5M+ IT and business
      transformation projects. Manages cross-functional teams of 20+, mentors junior PMs, and
      has built PMO processes that cut project initiation time by [X%].

