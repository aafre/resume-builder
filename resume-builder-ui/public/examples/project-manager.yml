mistakes:
  - mistake: "Writing \"successfully managed projects\" with no delivery metric"
    fix: "State the outcome: \"Delivered a $3.5M ERP implementation on time and [X%] under budget.\" On-time percentage and budget variance are the two numbers every PM hiring manager looks for first."
  - mistake: "Omitting team size and budget scale"
    fix: "Name both: \"Managed a $8M portfolio with cross-functional teams of 15-25.\" Without scale, \"led a team\" could mean 3 people or 30."
  - mistake: "Not naming the methodology"
    fix: "Say Agile, Waterfall, or hybrid explicitly, and back it up (\"ran sprint planning and retrospectives for 4 teams\") — a resume that never names a methodology reads as unfamiliar with how modern PM work is actually structured."
  - mistake: "Listing PMP as \"in progress\" with no target date or ambiguous phrasing"
    fix: "Be precise: \"PMP-certified\" or \"PMP exam scheduled [month/year].\" Many postings hard-filter on the certification, so vague phrasing risks getting screened out for what may be a near-term formality."

bulletRewrites:
  - weak: "Managed multiple projects and led teams"
    improved: "Led a portfolio of 5 concurrent projects totaling $8M annual budget, managing cross-functional teams of 15-25 across development, design, and analytics"
    reason: "Replaces a vague claim with the actual scale (budget, team size, number of projects) a hiring manager can compare to their own org."
  - weak: "Responsible for project delivery on time and on budget"
    improved: "Delivered a $3.5M ERP implementation on time and [X%] under budget, coordinating 8 vendor teams across 4 time zones"
    reason: "Turns a job-description phrase into a specific, dated achievement with both a dollar figure and a coordination detail that shows the real complexity."
  - weak: "Handled risk management for projects"
    improved: "Built a risk management framework that identified and mitigated 50+ project risks, preventing an estimated [dollar amount] in potential rework"
    reason: "Shows risk management as a system built, not a task performed, with the placeholder marking where a real dollar estimate belongs."
  - weak: "Ran Agile ceremonies for the team"
    improved: "Implemented an Agile transformation across 4 teams, increasing sprint velocity [X%] within two quarters through refined backlog grooming and retrospective action items"
    reason: "Names the specific practices (backlog grooming, retrospectives) and a measurable velocity outcome instead of a generic \"ran ceremonies\" claim."

