customFaqs:
  - question: "Do I need PMP certification to get a project manager job?"
    answer: "Not always for entry- and mid-level roles, but many postings at larger companies list it as a hard requirement, especially for senior roles or government contracts. If you're PMP-eligible but not yet certified, say so precisely (\"PMP exam scheduled\") rather than leaving it ambiguous."
  - question: "Should a project manager resume say Agile or Waterfall?"
    answer: "Name whichever your projects actually used, or both if your background is mixed. Naming the framework tells a hiring manager what your day-to-day looked like — sprint ceremonies and backlogs versus phase-gated milestones and sign-offs — and many postings filter on the specific methodology."
  - question: "How do I quantify project management experience without a huge budget?"
    answer: "Budget size is only one metric. On-time delivery percentage, number of projects completed, team size, stakeholder count, or percentage improvement in a process (like sprint velocity) all work — pick whichever metric your actual project supports rather than inflating the dollar figure."
  - question: "What's the difference between a project manager and a program manager resume?"
    answer: "A project manager resume shows delivery of individual projects with defined scope, budget, and timeline. A program manager resume shows oversight of multiple related projects (a portfolio) toward a shared strategic goal, with more emphasis on cross-project dependencies and executive reporting."

