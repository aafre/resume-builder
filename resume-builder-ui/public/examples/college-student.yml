mistakes:
  - mistake: "Listing coursework as a bare list of class names"
    fix: "Turn one relevant class into a project bullet with a deliverable and number: 'Built a data visualization dashboard analyzing e-commerce trends using Tableau for a capstone project.'"
  - mistake: "Putting Experience above Education"
    fix: "As a current student, Education goes first — it's your strongest credential until you have 2+ years of full-time work history."
  - mistake: "Writing 'various leadership roles' instead of naming the scope"
    fix: "Name the organization, your title, and a number: members led, budget managed, or membership growth. Vague leadership claims read as filler."
  - mistake: "Omitting a part-time or retail job because it feels unrelated to the major"
    fix: "Keep it. Cash handling, training new hires, and hitting customer-satisfaction numbers are transferable skills recruiters screen entry-level candidates for."

bulletRewrites:
  - weak: "Worked on marketing projects for class"
    improved: "Developed a full digital marketing plan for a local nonprofit as a capstone project, presenting to a panel of [number] marketing professionals and resulting in a [X%] donation increase"
    reason: "Names the deliverable, the audience, and the measurable outcome — turning a class assignment into evidence of applied skill."
  - weak: "Active member of student organizations"
    improved: "Served as Vice President of the Marketing Club, growing membership from [X] to [Y] students and organizing [number] networking events per semester"
    reason: "Replaces a vague membership claim with a specific title, a growth number, and a recurring responsibility."
  - weak: "Good at Excel and data analysis"
    improved: "Built pivot-table dashboards analyzing [dataset] for a market research project surveying 200+ respondents, presenting findings to inform a go/no-go recommendation"
    reason: "Names the tool, the scale of the data, and the business outcome the analysis fed into."
  - weak: "Helped with events on campus"
    improved: "Co-organized [number] campus events with attendance of 100-500 students and a combined budget of $15,000, coordinating with vendors and facilities staff"
    reason: "Adds scale (attendance, budget) and shows cross-team coordination, not just task participation."

