answerBlock: >
  A strong retail sales associate resume leads with a sales number (dollar volume or
  percent-to-target) and the department/SKU scale you handled, not "provided excellent
  customer service." Name your POS and CRM tools, and show a conversion or attachment-rate
  result if you have one.

howToWrite:
  - "Open with a quantified sales result: dollar volume, percent-to-target, or team ranking. 'Friendly and hardworking' is invisible next to a number."
  - "Name the store/department scale — SKU count, square footage, or transaction volume — so a hiring manager can tell if your experience matches their environment (boutique vs. big-box)."
  - "List the POS and inventory systems you've used by name (Shopify POS, Square, RFID scanning) — these are keyword filters, not generalities."
  - "Show a service metric alongside the sales metric: satisfaction score, return-customer rate, or complaint resolution rate. Retail hiring managers want both revenue and retention evidence."
  - "If you trained or led other associates, quantify it (headcount, onboarding time reduced) — it signals promotion readiness even from a non-management title."
  - "Cut generic duties like 'stocked shelves' unless tied to an outcome (shrinkage reduction, inventory accuracy) — every retail candidate did this; only the outcome differentiates you."

summaryExamples:
  - level: entry
    summary: >
      Energetic and customer-focused retail associate with experience in fast-paced mall and
      big-box environments. Comfortable operating POS systems, processing returns, and meeting
      daily sales goals. Strong product knowledge and a track record of positive customer
      feedback.
  - level: mid
    summary: >
      Results-driven retail sales associate with 4+ years of experience exceeding sales targets
      in high-volume retail environments. Achieves [dollar amount]+ in monthly sales, consistently
      exceeding targets by [X%], while training new hires on POS systems and sales technique.
  - level: senior
    summary: >
      Senior retail sales associate with 6+ years across department and specialty retail,
      including 2 years mentoring new associates and covering supervisor shifts. Manages a
      personal client book of 200+ repeat customers and consistently ranks in the top [X%] of
      sales performers.

