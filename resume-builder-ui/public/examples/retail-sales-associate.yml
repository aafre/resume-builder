customFaqs:
  - question: "What should a retail sales associate put at the top of their resume?"
    answer: "A quantified sales result — dollar volume, percent-to-target, or a ranking among peers — beats a general \"customer-focused\" statement. Hiring managers in retail scan for revenue evidence first."
  - question: "How do I show retail sales numbers if my store doesn't track individual performance?"
    answer: "Use team- or department-level numbers instead: total department sales, your team's ranking, or a service metric like customer satisfaction survey scores. Any real number beats none."
  - question: "What POS or retail software should I list on my resume?"
    answer: "Name the actual systems you used: Shopify POS, Square, Lightspeed, or a company-specific system. If you also used inventory or CRM tools (client book software, RFID scanning), list those separately — they're distinct keywords."
  - question: "Is retail sales experience relevant for customer service or admin roles?"
    answer: "Yes — retail sales experience transfers well to customer service and administrative roles because it demonstrates high-volume customer interaction, POS/CRM systems, and performance-under-pressure, all of which those roles also screen for."

