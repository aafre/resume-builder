mistakes:
  - mistake: "Writing \"provided excellent customer service\" with no sales evidence"
    fix: "Lead with a number: \"Achieved [dollar amount]+ monthly sales, exceeding targets by [X%].\" Service claims without a sales or retention metric attached are the most common retail resume filler."
  - mistake: "Listing \"stocked shelves and helped customers\" as the whole job"
    fix: "Break it into what actually differentiates you: sales performance, visual merchandising, upselling technique, or loss-prevention contribution — each is a separate signal to a hiring manager."
  - mistake: "Omitting the store/department scale"
    fix: "State the SKU count, square footage, or transaction volume you worked with. A boutique of 200 SKUs and a big-box floor of 15,000 need different skill sets, and naming yours helps the resume match the right role."
  - mistake: "Not naming the POS or CRM system used"
    fix: "Name it: Shopify POS, Square, Lightspeed, or a proprietary big-box system. \"Cash register experience\" reads as entry-level even if your actual system experience is more advanced."

bulletRewrites:
  - weak: "Helped customers find products and checked them out"
    improved: "Assisted 100+ customers daily with product selection and checkout, maintaining expert knowledge across 500+ SKUs in men's apparel and accessories"
    reason: "Adds daily volume and SKU scope, turning a generic duty into evidence of product depth and pace."
  - weak: "Responsible for meeting sales goals"
    improved: "Achieved [dollar amount]+ in monthly sales, exceeding targets by [X%] and ranking [number] among [team size] associates in department"
    reason: "Converts a vague responsibility into a ranked, quantified outcome; placeholders mark where the candidate fills in their real figures."
  - weak: "Worked the register and handled returns"
    improved: "Processed [number]+ POS transactions weekly with [number] cash-drawer discrepancies, including returns and exchanges while maximizing customer retention"
    reason: "Shows accuracy (a low, honest discrepancy count) and reframes returns handling as a retention-focused skill, not just a task."
  - weak: "Good at customer service and team player"
    improved: "Maintained [X%] customer satisfaction rating while training [number] new associates on sales technique and POS operations"
    reason: "Replaces a subjective self-description with a measurable service outcome plus a leadership signal (training others)."

