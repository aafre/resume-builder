  - HDI Customer Service Representative
  - Zendesk or Salesforce Support Administrator (platform-specific)

mistakes:
  - mistake: "Writing \"provided excellent customer service\" with no volume or channel detail"
    fix: "State the actual numbers: \"Resolved 80+ inquiries daily via phone, email, and chat with 98% satisfaction.\" Volume and channel mix tell a hiring manager what pace and complexity you're used to."
  - mistake: "Naming \"conflict resolution\" as a skill with no outcome attached"
    fix: "Show the result: \"De-escalated 50+ difficult situations monthly, retaining 90% of at-risk accounts.\" A skill claim without an outcome is unverifiable and gets skimmed past."
  - mistake: "Omitting the specific CRM or ticketing platform used"
    fix: "Name it: Zendesk, Salesforce, Freshdesk, or a proprietary system. \"Customer service software\" is not a keyword an ATS or recruiter searches for."
  - mistake: "Listing only ticket volume with no quality metric"
    fix: "Pair volume with a quality number: first-contact resolution rate, CSAT score, or average handling time. Volume alone can read as \"answered a lot of tickets slowly and unhelpfully\" without a quality signal next to it."

bulletRewrites:
  - weak: "Answered customer calls and resolved issues"
    improved: "Resolved 80+ customer inquiries daily via phone, email, and chat with a 98% satisfaction rating, reducing average handling time by 25%"
    reason: "Adds volume, channel mix, and a quality metric — three specific facts that replace one vague duty statement."
  - weak: "Handled difficult customers and complaints"
    improved: "De-escalated [number]+ difficult customer situations monthly, retaining [X%] of at-risk accounts through proactive follow-up"
    reason: "Converts an abstract skill claim into a measurable retention outcome; placeholders mark where the candidate fills in their real numbers."
  - weak: "Used CRM system to track customer issues"
    improved: "Documented and tracked [number]+ customer interactions in Zendesk, maintaining [X%] SLA compliance on response times"
    reason: "Names the specific platform and reframes routine data entry as a compliance/performance metric."
  - weak: "Trained new employees on the job"
    improved: "Trained and mentored 5 new team members on company policy and CRM systems, cutting new-hire ramp time by [X%]"
    reason: "Quantifies the training group and frames it as a measurable process improvement rather than a passive duty."

