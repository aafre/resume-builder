answerBlock: >
  A strong customer service representative resume leads with contact volume and channel mix
  (calls, chat, email) plus a satisfaction or resolution-rate number, and names the specific
  CRM/ticketing system used — not "provided excellent service to customers."

howToWrite:
  - "State your daily/weekly contact volume and channel mix (phone, chat, email) — a hiring manager needs to know if you handled 30 calls a day or 100+ across three channels."
  - "Name your CRM and ticketing platform by name (Zendesk, Salesforce, Freshdesk) — recruiters and ATS filters search for the specific tool, not \"customer service software.\""
  - "Quantify a resolution metric: first-contact resolution rate, average handling time, or CSAT score. These are the numbers call center hiring managers screen resumes for first."
  - "Show de-escalation ability with a specific outcome, not just the phrase 'conflict resolution' — e.g. retained X% of at-risk accounts after an escalated complaint."
  - "If you mentored or trained others, quantify the group size and any measurable improvement (reduced onboarding time, raised team CSAT) — it signals readiness for a team lead role."
  - "Separate technical/process contributions (building a FAQ knowledge base, flagging a defect pattern) from routine ticket handling; process improvements differentiate you from a resume that only lists volume."

summaryExamples:
  - level: entry
    summary: >
      Customer-focused representative with experience handling phone and chat inquiries in a
      fast-paced environment. Comfortable using CRM and ticketing systems, resolving routine
      issues, and escalating complex cases appropriately. Known for a calm, patient
      communication style.
  - level: mid
    summary: >
      Dedicated customer service professional with 4+ years of experience resolving 80+
      customer inquiries daily via phone, email, and chat while maintaining a 98% satisfaction
      rating. Skilled in Zendesk and Salesforce, conflict resolution, and cross-team
      collaboration on recurring issues.
  - level: senior
    summary: >
      Senior customer service professional with 7+ years across call center and SaaS support
      environments, including 2 years mentoring junior representatives and covering supervisor
      duties. Improved team CSAT by 15% through training and process documentation, and reduced
      average handling time 25% through workflow changes.

