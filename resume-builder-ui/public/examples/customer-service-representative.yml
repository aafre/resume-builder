customFaqs:
  - question: "What CRM software should a customer service resume list?"
    answer: "Name the specific platform you used: Zendesk, Salesforce, Freshdesk, or a company-proprietary system. Listing the actual product name, not just \"CRM experience,\" is what ATS keyword filters and hiring managers scan for."
  - question: "How do I quantify customer service experience without exact metrics from my employer?"
    answer: "Estimate conservatively from your shift structure — if you handled a call every 4-5 minutes across an 8-hour shift, that's a reasonable daily volume estimate. A CSAT or resolution-rate estimate based on regular manager feedback is also fair to include if you note it's approximate."
  - question: "Is call center experience relevant for a non-phone customer service role?"
    answer: "Yes — the underlying skills (de-escalation, CRM/ticketing systems, SLA compliance, multi-channel communication) transfer directly to chat, email, and in-person support roles. Emphasize the transferable systems and metrics rather than the phone-specific details."
  - question: "Should I mention specific software certifications like Zendesk Support Administrator?"
    answer: "Yes, if you hold one — platform-specific certifications are a fast way to signal you can be productive on day one without ramp-up training on the tool the employer already uses."

