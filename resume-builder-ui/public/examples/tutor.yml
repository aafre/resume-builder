mistakes:
  - mistake: "Listing subjects taught with no outcome evidence"
    fix: "Pair the subject list with a result: '50+ students improved by [a letter grade or more]' or 'average SAT Math score increase of [X] points.' Subjects alone don't differentiate one tutor from another."
  - mistake: "Omitting the grade range or student level served"
    fix: "State it explicitly (grades 6-12, undergraduate Calculus) — learning centers and parents filter tutors by student level before anything else."
  - mistake: "Not mentioning session format or platform"
    fix: "Note in-person vs. online and any specific tool (Zoom, virtual whiteboard) — many current openings are online-only and screen for comfort with the format."
  - mistake: "No rating, retention, or parent-feedback metric anywhere"
    fix: "Add one if available: average session rating, percentage of students retained, or a specific parent testimonial theme. It's the strongest trust signal a tutor resume can include."

bulletRewrites:
  - weak: "Tutored students in math and science"
    improved: "Provided one-on-one and small-group tutoring in Algebra, Geometry, Chemistry, and Physics for students grades 6-12, helping 50+ students improve grades by [one letter grade or more]"
    reason: "Names the exact subjects, the student range, and a measurable outcome across a defined student count."
  - weak: "Made lesson plans for students"
    improved: "Developed customized lesson plans addressing individual learning gaps for [number] active students, tracking progress and reporting to parents on a [weekly/biweekly] basis"
    reason: "Turns a generic planning task into a structured, recurring process with a caseload size and a reporting cadence."
  - weak: "Helped students prepare for tests"
    improved: "Prepared 30+ students for SAT Math with an average score increase of [X] points through weekly targeted practice tests and error-pattern analysis"
    reason: "Adds the specific exam, a student count, and a quantified score result — the exact evidence a test-prep client screens for."
  - weak: "Built a private tutoring business"
    improved: "Built a private tutoring practice serving 15+ regular students, managing scheduling, billing, and parent communications independently using [scheduling/invoicing tool]"
    reason: "Frames self-employment as a real operating practice with client volume and named operational responsibilities."

