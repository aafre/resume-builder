mistakes:
  - mistake: "Writing a generic 'seeking opportunities to grow' summary"
    fix: "Name the specific function (software engineering intern, data intern) and the type of company or stack you're targeting — it tells the recruiter which team to route your resume to."
  - mistake: "Treating class projects as less legitimate than work experience"
    fix: "List projects with the same structure as a job: name, stack, and what it does. For a candidate with no internship history, a well-described project is the primary evidence of ability."
  - mistake: "Listing 'completed relevant coursework' with no course names"
    fix: "Name the actual courses (Data Structures, Database Systems, Operating Systems) — recruiters and resume screeners look for the specific title, not the category."
  - mistake: "No GitHub or portfolio link despite having real projects"
    fix: "Add the link if the repo is active and browsable. A recruiter clicking through to real code is stronger evidence than another resume bullet."

bulletRewrites:
  - weak: "Built some projects for class"
    improved: "Built a full-stack task management app using React, Node.js, and MongoDB, implementing user authentication and a REST API consumed by [number]+ test users"
    reason: "Names the exact stack, the feature set, and a usage scale — turning a vague 'built projects' claim into a specific, defensible piece of work."
  - weak: "Helped students with programming"
    improved: "Served as Teaching Assistant for Intro to Programming, leading weekly labs for 30 students and creating supplemental study guides that improved average exam scores by 12%"
    reason: "Converts informal helping into a titled, recurring responsibility with a measurable outcome (exam score improvement)."
  - weak: "Did IT support on campus"
    improved: "Provided technical support to 500+ students and faculty, documenting solutions in a knowledge base that reduced repeat tickets by 25%"
    reason: "Adds scale (500+ users) and a process improvement with a measured result, not just a task description."
  - weak: "Fixed a website for a nonprofit"
    improved: "Redesigned a nonprofit's website on WordPress, building a new donation page that increased online contributions by 40% in the first quarter"
    reason: "Names the platform, the specific deliverable (donation page), and a business outcome the work directly caused."

