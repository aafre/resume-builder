# Internship Resume Example
# Category: Entry Level (Tier 4)

meta:
  slug: internship
  title: Internship Resume
  metaTitle: "Free Internship Resume Example & Template (2026)"
  metaDescription: "Internship resume example highlighting academic projects and relevant coursework."
  category: entry-level
  priority: 0.7
  lastmod: '2026-09-23'

answerBlock: >
  An internship resume is applying FOR experience, not documenting it — so it needs a clear
  target function (which team, which kind of work) up front, then coursework projects and
  campus technical roles as evidence you can contribute from day one. Name the languages and
  tools you'd actually use on the team, not a generic "fast learner" summary.

howToWrite:
  - "State the specific team or function you're targeting in the summary (software engineering intern, data intern) — a generic 'seeking opportunities' summary makes a recruiter guess which req to route you to."
  - "Lead with 2-3 substantial class or personal projects, each with the stack used and what the project actually does — for a candidate with no professional experience, projects ARE the evidence of skill."
  - "List every relevant course by name where it maps to the role (Data Structures, Algorithms, Database Systems), not just 'completed core CS coursework' — recruiters and ATS filters match on the specific course title."
  - "Add any campus technical role (TA, help desk, research assistant) even if unpaid or part-time — it shows you can apply skills in a structured, accountable setting."
  - "Include a GitHub link if you have real, browsable code — for a technical internship, a working repo is stronger evidence than another bullet point."
  - "Keep it to one page with Education first, then Projects, then Experience — for a first internship, projects usually outweigh work history."

summaryExamples:
  - level: entry
    summary: >
      Sophomore computer science student seeking a first summer software engineering
      internship. Built two personal projects using Python and JavaScript and completed
      coursework in data structures and algorithms. Comfortable with Git and eager to
      contribute to a team codebase.
  - level: mid
    summary: >
      Junior computer science student targeting a second software engineering internship
      after a prior internship building full-stack features in React and Node.js.
      Teaching assistant for Intro to Programming, mentoring 30 students weekly.
      Proficient in Python, Java, and JavaScript with active open-source contributions.
  - level: senior
    summary: >
      Graduating senior seeking a final internship before full-time software engineering
      roles. One completed internship plus a semester-long capstone project shipped as a
      production-style full-stack application. Strong in Python, React, and SQL with
      hands-on debugging and code review experience from a TA role.

