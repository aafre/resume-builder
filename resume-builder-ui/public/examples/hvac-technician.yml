answerBlock: >
  A strong HVAC technician resume leads with your EPA 608 certification level and system
  scale (residential split systems vs. 50-ton commercial rooftop units), then proves
  reliability with a first-time fix rate or customer satisfaction number — not just
  "installed and repaired HVAC systems."

howToWrite:
  - "State your EPA 608 certification type (Type I, II, Universal) up front — refrigerant handling is federally regulated, and employers legally need this before they can put you on certain jobs."
  - "Name the system scale you've worked on: residential splits/mini-splits versus commercial rooftop units measured in tons. A 3-ton residential job and a 50-ton commercial install require different skill depth."
  - "Quantify daily call volume during peak season (e.g. '8-10 service calls daily') so a hiring manager can gauge your pace under summer/winter demand spikes."
  - "State a first-time fix rate or customer satisfaction score — these are the reliability metrics HVAC service managers screen resumes for."
  - "Name your refrigerant and diagnostic experience specifically (R-410A, VRF systems, electronic leak detectors) rather than 'HVAC repair skills.'"
  - "If you mentor apprentices or handle preventive-maintenance contracts for a building portfolio, quantify it — it signals readiness for a lead tech or account-management track."

summaryExamples:
  - level: entry
    summary: >
      EPA 608-certified HVAC apprentice with hands-on training in residential and light
      commercial systems. Completed 2,000+ hours of a 4-year apprenticeship assisting senior
      technicians on 150+ jobs, including installation, ductwork, and preventive maintenance.
  - level: mid
    summary: >
      EPA-certified HVAC technician with 7+ years of experience installing, maintaining, and
      repairing residential and commercial HVAC systems. Services 8-10 calls daily during peak
      season, handles refrigerant recovery and charging per EPA guidelines, and maintains a
      97% customer satisfaction rating.
  - level: senior
    summary: >
      Senior HVAC technician with 10+ years across residential, commercial, and light
      industrial systems, including 3 years leading installation projects up to 50 tons and
      mentoring junior technicians. Maintains a 95% first-time fix rate and a 40% repeat
      customer/referral rate.

