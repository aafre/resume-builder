mistakes:
  - mistake: "Writing \"installed and repaired HVAC systems\" with no scale or certification detail"
    fix: "State your EPA 608 level and the system scale: \"EPA 608 Universal-certified technician installing residential splits up to commercial rooftop units up to 50 tons.\" Without this, the bullet reads the same for an apprentice and a lead tech."
  - mistake: "Omitting the first-time fix rate or satisfaction score"
    fix: "State it directly: \"Achieved 95% first-time fix rate through thorough diagnostic procedures.\" Service managers screen for reliability metrics, not just years of experience."
  - mistake: "Not naming the refrigerant type or diagnostic tools used"
    fix: "Name it: R-410A, VRF systems, electronic leak detectors, UV dye. \"Refrigerant handling\" alone doesn't show which systems you're actually qualified on."
  - mistake: "Leaving out peak-season call volume"
    fix: "State your daily volume during peak season (e.g. '8-10 residential and light commercial calls daily'). It signals your pace under real demand, which is different from off-season workload."

bulletRewrites:
  - weak: "Installed and serviced HVAC systems"
    improved: "Installed and serviced residential split systems and commercial rooftop units up to 50 tons, leading installation projects and mentoring 3 junior technicians"
    reason: "Adds system scale and leadership scope, converting a generic duty into evidence of technical range and readiness to lead."
  - weak: "Diagnosed and fixed HVAC problems"
    improved: "Diagnosed compressor and motor failures using multimeters and schematics, achieving a [X%] first-time fix rate and reducing customer downtime"
    reason: "Names the diagnostic method and adds a measurable reliability outcome; placeholder marks where the candidate fills in a real percentage."
  - weak: "Performed maintenance on equipment"
    improved: "Performed seasonal preventive maintenance on [number]+ units annually, extending average equipment life by [number] years and reducing emergency breakdown calls"
    reason: "Converts a routine task into a quantified reliability and cost-avoidance outcome for the customer."
  - weak: "Provided good customer service"
    improved: "Maintained a [X%] customer satisfaction rating and a [X%] repeat/referral rate by explaining repair options clearly and completing work within quoted pricing"
    reason: "Replaces a subjective claim with two measurable business outcomes (satisfaction and referral rate) tied to specific behavior (clear communication, accurate quoting)."

