customFaqs:
  - question: "Do I need EPA 608 certification listed on my HVAC resume?"
    answer: "Yes, and specify the type (Type I, II, or Universal). Refrigerant handling is federally regulated under the EPA, so employers need to confirm your certification level before assigning certain jobs — this is a hard requirement, not a preference."
  - question: "How do I show HVAC experience without exact call-volume numbers?"
    answer: "Estimate from your typical shift — if you completed roughly 8-10 residential calls per day during peak season, use that as a reasonable range. A conservative, clearly-scoped estimate beats omitting the number entirely."
  - question: "What's the difference between residential and commercial HVAC experience on a resume?"
    answer: "Residential experience usually centers on split systems and mini-splits sized in tons (2-5 tons typical); commercial experience involves larger rooftop units, VRF systems, and building-wide load calculations, often 20-50+ tons. State which scale you've worked so the resume matches the employer's system type."
  - question: "Should I mention specific refrigerants like R-410A on my resume?"
    answer: "Yes — naming the refrigerant types and diagnostic tools (electronic leak detectors, UV dye, thermal imaging) you're experienced with is more specific and credible than a general \"refrigerant handling\" skill line."

