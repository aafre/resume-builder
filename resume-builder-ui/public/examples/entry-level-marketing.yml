mistakes:
  - mistake: "Leaving out unpaid or student-org marketing work because it 'doesn't count'"
    fix: "Include it and name the result — growing a club's Instagram to [X]K followers is real, evidenced marketing experience, not padding."
  - mistake: "Listing a marketing course title with no project or output"
    fix: "Attach what you actually produced: \"Digital Marketing (capstone: campaign for local nonprofit reaching 500+ survey respondents).\""
  - mistake: "Writing \"passionate about marketing\" instead of showing evidence"
    fix: "Replace the self-description with a specific piece of work and its result — a hiring manager weighs one concrete example over any number of adjectives."
  - mistake: "Padding to two pages with generic bullet points"
    fix: "Cut to one page and keep only bullets with a specific tool, action, and result — a short resume of evidenced work reads stronger than a long one of vague tasks."

bulletRewrites:
  - weak: "Helped with social media for a student club"
    improved: "Managed Instagram and TikTok accounts for a 200-member student club, growing followers from [X] to [Y] over one semester through a weekly content calendar"
    reason: "Turns unpaid club work into a specific, measurable marketing result with a stated timeframe."
  - weak: "Completed a marketing class project"
    improved: "Built an integrated marketing campaign for a local nonprofit as a capstone project, including a market research survey with 500+ respondents"
    reason: "Names the deliverable and a concrete number instead of describing it as generic coursework."
  - weak: "Interned in marketing over the summer"
    improved: "Assisted campaign execution across email, social, and digital channels during a 12-week marketing internship, creating content that achieved [X%] higher engagement than the prior quarter"
    reason: "Adds duration, channel scope, and a comparative performance outcome to an otherwise generic internship line."
  - weak: "Good with social media and writing"
    improved: "Wrote and scheduled [number]+ social posts monthly for [organization/client], using Canva for graphics and tracking performance in [platform analytics tool]"
    reason: "Replaces a self-assessed skill claim with a specific output volume and the tools used to produce it."

customFaqs:
  - question: "How do I write an entry-level marketing resume with no full-time marketing job?"
    answer: "Lead with whatever marketing work you've actually done — an internship, a student organization's social accounts, a class capstone campaign, or freelance work for a local business. A hiring manager reads unpaid or academic marketing work as real evidence as long as you attach a specific result to it, not just a task description."
  - question: "Should I include my GPA or coursework on an entry-level marketing resume?"
    answer: "Include coursework only when you can attach a project or measurable output to it — a bare course title adds little. GPA is worth including if it's 3.5 or above; otherwise, leave it off and let your project and internship evidence carry the resume instead."
  - question: "What's the difference between an entry-level marketing resume and a marketing coordinator resume?"
    answer: "An entry-level resume draws its evidence from coursework, internships, and student organizations because there's no marketing job yet. A coordinator resume draws from in-role channel ownership and execution results. If you've held a marketing coordinator title, even briefly, that experience belongs at the top instead."
  - question: "How do I quantify results from a student club or unpaid project?"
    answer: "Use whatever numbers you tracked at the time — follower count before and after, survey response count, email open rate, event attendance. If you didn't track a metric, reconstruct a reasonable estimate from what you remember rather than omitting the achievement entirely."

