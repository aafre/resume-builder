mistakes:
  - mistake: "Saying \"assisted with marketing initiatives\" with no owned channel"
    fix: "Name the channel you owned end-to-end: \"Managed email campaigns for a 20K-subscriber list\" reads as ownership, not support."
  - mistake: "Listing content volume with no performance result"
    fix: "Pair the cadence with an outcome: \"20+ posts weekly, growing engagement rate [X%] quarter over quarter\" — volume alone doesn't show the work landed."
  - mistake: "Naming \"social media\" without the specific platforms"
    fix: "List the platforms by name — Instagram, LinkedIn, TikTok — since campaign mechanics and audience differ enough that recruiters filter on the platform."
  - mistake: "Combining campaign coordination and event planning into one vague bullet"
    fix: "Separate them: they're different skill sets, and naming both broadens which coordinator openings the resume matches."

bulletRewrites:
  - weak: "Assisted with marketing campaigns across channels"
    improved: "Coordinated email, social, and paid ad campaigns across 3 channels for a [industry] brand, increasing email open rates by [X%] through A/B testing"
    reason: "Names the owned channels and attaches a measurable, testable outcome instead of a support-level description."
  - weak: "Managed social media content calendar"
    improved: "Managed a 20-post weekly content calendar across 4 platforms, growing combined followers from [X] to [Y] over [timeframe]"
    reason: "Quantifies cadence and platform count, then closes with a specific growth result."
  - weak: "Helped plan company events"
    improved: "Planned and executed [number] corporate events annually with budgets up to $[amount], coordinating venue, catering, and 50+ attendee logistics"
    reason: "Shows event scale (budget, headcount) rather than an unspecified planning task."
  - weak: "Created marketing materials for the team"
    improved: "Produced [number]+ pieces of marketing collateral (email, social graphics, one-pagers) monthly using Canva and Adobe, supporting [number] concurrent campaigns"
    reason: "Names the tools and output volume, making the production workload legible to a hiring manager."

customFaqs:
  - question: "What's the difference between a marketing coordinator and a marketing manager resume?"
    answer: "A coordinator resume emphasizes in-role execution — the channels you owned, the content calendar you ran, the events you coordinated. A manager resume emphasizes strategy, budget ownership, and team leadership. If you're applying to a coordinator role, lead with execution volume and results, not aspirational strategy language."
  - question: "How many marketing tools should I list on a coordinator resume?"
    answer: "List the tools you've actually used hands-on, grouped by function — email (Mailchimp, HubSpot), analytics (Google Analytics), design (Canva, Adobe). 8-12 named tools is typical; a longer unfocused list reads as padding rather than depth."
  - question: "How do I show marketing coordinator experience without exact campaign numbers?"
    answer: "Use a bracketed placeholder for the real figure you can't recall exactly (\"[X%] increase in open rate\") rather than a rounded guess, or describe the scope instead — platform count, content cadence, or team size supported — until you can confirm the metric."
  - question: "Should a marketing coordinator resume include event planning experience?"
    answer: "Yes, if it's part of the role — name it separately from campaign coordination since it's a distinct skill set (vendor logistics, budget, attendee management). Naming both broadens which coordinator openings your resume matches, since some roles weight events more heavily than others."

