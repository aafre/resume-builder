howToWrite:
  - "Write each engagement as one story: the customer problem, what you scoped in discovery, what you built, and whether it reached production. The postings behind this page describe that whole arc, so a resume that only covers the build leaves most of the job out."
  - "Say plainly whether each system reached production. A demo, a pilot and a production rollout are different claims, and an interviewer will ask which one yours was."
  - "Name the people you worked with by role rather than by company, such as \"claims operations lead\" or \"customer IT team\". That shows the stakeholder work without giving away who the client was."
  - "Put each language next to the work you did in it. Every posting sampled here names Python, and some accept TypeScript, Java or C++ as alternatives, so list what you actually shipped in rather than everything you've touched."
  - "If you built evals, say what they measured against: the customer's acceptance criteria, a held-out set of real cases, or a cost or latency limit."
  - "Show seniority through scope, not years. Junior bullets deliver a scoped task. Senior ones define the engagement, make the architecture calls, settle disagreements between customer leads, and turn repeated field requests into product features."

summaryExamples:
