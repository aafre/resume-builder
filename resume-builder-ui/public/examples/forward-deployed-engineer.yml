mistakes:
  - mistake: "A consulting resume with no shipped code"
    fix: "Every engagement needs a line on what you built and shipped. Without it, the resume reads as a pre-sales or advisory role."
  - mistake: "A coding resume with no customer context"
    fix: "Say who the system was for and how you found out what they needed. Otherwise it looks like internal feature work."
  - mistake: "Calling a demo a production deployment"
    fix: "Use \"demo\", \"pilot\" and \"production\" precisely. Expect to be asked how many people used it and who ran it after you left."
  - mistake: "Claiming the account's revenue as your own"
    fix: "Describe your technical contribution, such as unblocking the deployment or reaching [number] active users, not the contract value the sales team booked."
  - mistake: "Naming confidential client details"
    fix: "Describe the customer by sector and size (\"a regional insurer\") and leave out names, data and internal systems you aren't cleared to share."
  - mistake: "Assuming every FDE role uses the same stack"
    fix: "The postings differ. One is built around a single vendor's models, another lists several languages as alternatives. Match your resume to the languages and tools in each posting you apply to."

bulletRewrites:
  - weak: "Built a demo of an AI assistant for a customer"
    improved: "Took a customer's [workflow] assistant from demo to production for [number] users in [timeframe], adding evals, monitoring and a rollback path before launch"
    reason: "A demo and a production system are different claims. This one says it reached production and names what made it safe to ship."
  - weak: "Worked closely with customers to understand their needs"
    improved: "Ran discovery with [customer]'s operations and IT leads, narrowed [number] requested features to one [workflow], and got the architecture signed off in [timeframe]"
    reason: "Anyone can say they worked with customers. This shows a decision you drove and what came of it, which is where the interview will go."
  - weak: "Supported the rollout to end users"
    improved: "Led rollout of [system] to [number] users across [number] teams, ran weekly feedback sessions, and raised completed workflows from [baseline] to [result] over [period]"
    reason: "Adoption is part of the job. The rewrite names who used the system and how you measured whether they kept using it."
  - weak: "Passed customer feedback to the product team"
    improved: "Turned a request repeated across [number] deployments into a reusable [product capability], cutting setup time for later deployments from [X] to [Y]"
    reason: "Field work that becomes product is something one of the sampled postings asks for by name, and the rewrite puts a number on it."

customFaqs:
  - question: "How is a forward deployed engineer resume different from a software engineer or solutions engineer resume?"
    answer: "A software engineer resume can focus on internal feature delivery. A forward deployed engineer resume also needs customer discovery, stakeholder decisions and adoption. A solutions engineer (pre-sales) resume centres on demos and winning the deal, while an FDE resume has to show what you built and got into production. If a bullet would fit either of those roles unchanged, add the customer context or the production result."
  - question: "Can I get an FDE job without corporate client-facing experience?"
    answer: "You can make a credible case without it, as long as you show the same work another way. Internal users count as customers: a platform team serving other engineers, a tool built with an operations team, or open-source work where you took requests from users. Write those up as discovery, build and rollout, and say who the users were."
  - question: "How do I show problem structuring and business translation on a student resume?"
    answer: "Use projects that started from someone else's problem rather than a spec, such as a student society, a local business or a research group. Write down what they asked for, what you decided to build and why, and whether they used it. That's the same discovery-to-adoption shape the role asks for, just smaller."
  - question: "Should I include customer deployments or side projects on my FDE resume?"
    answer: "Lead with customer deployments that reached production, because that's the core of the role. Side projects help when other people actually use them, or when they show a skill your paid work doesn't, such as building an agent or writing evals. Put them in a short projects section below your experience."
  - question: "How do I describe confidential client work on my resume?"
    answer: "Describe the client by sector and size, such as \"a regional insurer\" or \"a logistics operator with four sites\", and leave out the name. Keep the parts that are yours to share: the problem type, the system you built, the stack, and the scope. If you're unsure what your contract allows, ask your employer before you publish anything."
  - question: "What metrics should a forward deployed engineer put on a resume?"
    answer: "Useful ones include production users, time from discovery to production, completed workflows, eval results against the customer's criteria, and setup time saved by reusable components. If a result wasn't measured, don't guess. Describe the scope you can verify instead: how many users, teams or sites, and what you owned."

