    bullets:
      - "Led [architecture change] across [teams/services], improving [reliability, latency or cost] at [system scale]"
      - "Authored and secured agreement on [technical decision], resolving [cross-team constraint] and enabling [delivery outcome]"

  - category: Migrations & Shared Systems
    bullets:
      - "Sequenced [legacy migration] across [dependencies], retiring [systems] while maintaining [compatibility/SLO]"
      - "Built [shared capability], adopted by [teams/products], reducing [duplicated engineering effort]"

  - category: Reliability & Standards
    bullets:
      - "Diagnosed [systemic incident class] and changed [architecture/operating practice], reducing [recurrence or recovery time]"
      - "Established [technical standard], improving [measured adoption, defect escape or lead time] across [scope]"

