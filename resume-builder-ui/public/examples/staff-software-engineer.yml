mistakes:
  - mistake: "Rebranding senior feature work as staff work"
    fix: "If every bullet stays inside one team's backlog, the title won't carry it. Lead with the work that crossed a team or service boundary, and cut feature bullets that don't show wider scope."
  - mistake: "Describing meetings instead of decisions"
    fix: "\"Attended architecture reviews\" says you were in the room. Write what you proposed, which alternative you rejected, and what shipped because of it."
  - mistake: "Taking sole credit for team results"
    fix: "Staff results are nearly always shared. Name your part (the design, the sequencing, the review you ran) and let the team own the rest. Interviewers probe this."
  - mistake: "Presenting mentoring as line management"
    fix: "Mentoring engineers across teams is staff work. Hiring, performance reviews and direct reports belong on an engineering manager resume, so claim them only if you actually held them."
  - mistake: "Big scale numbers with no baseline or personal contribution"
    fix: "\"Platform serving [number] requests a day\" says nothing about you. Give the before and after, the timeframe, and what you changed: \"cut p99 latency from [X] to [Y] by [change]\"."

bulletRewrites:
  - weak: "Migrated the dispatch service from the PHP monolith to Go microservices, improving response times"
    improved: "Sequenced the retirement of the dispatch monolith across [number] dependent services owned by [number] teams, agreeing the cut-over order with each owner and holding the [availability SLO] throughout"
    reason: "Same project, two scopes. The first line is senior work: you built the new service. The staff version shows the dependencies you untangled, the teams you aligned, and the constraint you protected."
  - weak: "Designed an event-driven order pipeline in Go handling [number] events a day"
    improved: "Wrote the design doc that moved [number] teams off a shared order database onto events, settled the ownership dispute over [shared state], and cut p99 checkout latency from [X] to [Y]"
    reason: "Same system again. The senior line proves you can build it; the staff line proves you chose the architecture, resolved a cross-team conflict, and moved a measured outcome."
  - weak: "Mentored junior engineers on the team"
    improved: "Coached [number] senior engineers through owning their first cross-team designs; [number] now lead design reviews for their own areas"
    reason: "Shows mentoring as growing technical leaders, with a result you can check, and doesn't imply you were anyone's line manager."
  - weak: "Took part in architecture discussions with other teams"
    improved: "Proposed and got sign-off on [technical standard] across [scope], replacing [number] incompatible approaches and cutting [defect escape or lead time] by [X]"
    reason: "Turns attendance into a decision you owned, names what it replaced, and ties it to a measure a hiring manager can ask about."

customFaqs:
  - question: "How is a staff software engineer resume different from a senior engineer or engineering manager resume?"
    answer: "A senior engineer resume shows strong delivery inside a team: features shipped, systems built, incidents fixed. A staff resume shows decisions that crossed teams, such as the architecture you set, the migration you sequenced and the engineers you grew into technical leaders. An engineering manager resume adds formal people management like hiring, performance reviews and direct reports. If you've never held those, keep your staff resume on the individual-contributor side."
  - question: "How do I show influence without authority on a staff engineer resume?"
    answer: "Write the decision and who adopted it. \"Wrote the design doc that four teams agreed to\" or \"built a service template nine teams now use\" shows influence without a reporting line. Add what changed after adoption, because influence that moved nothing is hard to defend in an interview."
  - question: "What is the difference between senior and staff engineer resume bullets?"
    answer: "A senior bullet shows what you built and how well it works. A staff bullet about the same project shows the decision behind it, the teams it touched and what you protected along the way, such as an SLO held through a migration. The rewrites above show the same project written both ways."
  - question: "Should a staff engineer resume be one or two pages?"
    answer: "Two pages is normal at staff level, provided the second page earns its space with cross-team work rather than old feature lists. Cut early-career bullets to one or two lines each. If everything important fits on one page, one page is fine."
  - question: "How much coding detail belongs on a staff software engineer resume?"
    answer: "Enough to show you still build: name the languages and systems per role, and keep one or two bullets on hands-on work. Most of the space should go to design, sequencing and cross-team outcomes, since that's what separates staff from senior. Leave out framework lists you couldn't discuss in a system design interview."
  - question: "Am I targeting the right level for staff software engineer roles?"
    answer: "Check your last two years against what the staff postings on this page ask for: architecture decisions beyond your team, mentoring engineers toward technical leadership, and, in one of them, aligning teams that don't normally work together. If most of your strongest bullets stay inside one team, senior roles may fit better for now. Companies draw the line differently, so read each posting's scope rather than relying on the title alone."
  - question: "Does solutions architect experience count as staff-level on a resume?"
    answer: "It can, if your bullets show engineering decisions you owned and systems that stayed in production. Architecture work that stopped at the proposal stage reads as advisory. Translate it into staff terms: what you designed, which teams built on it, and what it changed."

