  priority: 0.7
  lastmod: "2026-09-23"

answerBlock: >
  A strong electrician resume leads with your license level (apprentice, journeyman, master)
  and state, then proves scope with project scale (panel amperage, square footage, commercial
  vs. residential) and a clean safety record — not just "installed and repaired electrical
  systems."

howToWrite:
  - "State your license level and state up front (Journeyman Electrician, TX License #12345) — this is a legal qualification, not a resume nicety, and most postings filter on it before reading further."
  - "Name project scale: panel amperage, building square footage, or voltage class. 'Installed electrical systems' means something different at a 2,000 sq ft home versus a 500,000 sq ft commercial site."
  - "State your safety record explicitly (e.g. '[number] years without a workplace incident') — safety history is a hard screening factor for commercial and industrial employers."
  - "Cite the code standard you work to (NEC 2023, local amendments) — it signals you stay current, which matters because code updates on a regular cycle."
  - "If you led or trained apprentices, quantify the crew size — it's evidence of readiness for a foreman or lead role even without that title."
  - "List your specific tools/test equipment (multimeters, thermal imaging, amp clamps) alongside troubleshooting outcomes — 'troubleshooting skills' alone is a claim, the tool plus the result is evidence."

summaryExamples:
  - level: entry
    summary: >
      Licensed apprentice electrician with hands-on training in residential wiring, panel
      installation, and NEC code compliance. Completed 2,000+ hours of a 4-year apprenticeship
      program assisting journeymen on 50+ projects. Strong safety record and eager to advance
      toward journeyman licensure.
  - level: mid
    summary: >
      Licensed journeyman electrician with 8+ years of experience in commercial and
      residential electrical systems. Leads crews of 3-4 on installations up to 500K sq ft,
      maintains [number] years without a workplace incident, and completes projects on schedule
      with a [X%] customer satisfaction rating.
  - level: senior
    summary: >
      Master electrician with 15+ years across commercial, industrial, and residential
      projects, including 5 years supervising crews of 8+ and managing code-compliance
      sign-off for general contractors. Maintains a [X%] first-submission inspection pass
      rate and [number] years without a safety incident career-wide.

