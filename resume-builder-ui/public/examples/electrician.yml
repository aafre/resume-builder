mistakes:
  - mistake: "Writing \"installed and repaired electrical systems\" with no scale or license detail"
    fix: "State your license level and the project scale: \"Licensed journeyman electrician installing systems for commercial buildings up to 500K sq ft.\" Without licensure and scale, the bullet could describe a helper or a master electrician equally."
  - mistake: "Omitting the safety record"
    fix: "State it directly: \"Zero workplace incidents over 8-year career.\" Commercial and industrial employers screen for safety history as a hard filter, especially for crews handling live electrical work."
  - mistake: "Not naming the code standard worked to"
    fix: "Cite it: \"Ensured all work complied with NEC 2023 code requirements.\" Code updates on a cycle, so naming the version signals you stay current rather than working from outdated training."
  - mistake: "Listing \"troubleshooting\" as a skill with no tool or outcome"
    fix: "Pair the tool with the result: \"Used multimeters and thermal imaging to diagnose faults, reducing average repair time by [X%].\" A skill word alone is a claim; the tool and outcome are evidence."

bulletRewrites:
  - weak: "Installed and maintained electrical systems"
    improved: "Installed and maintained electrical systems for commercial buildings up to 500K sq ft, leading a crew of 3-4 apprentices on each project"
    reason: "Adds project scale and crew leadership, converting a generic duty into evidence of both technical scope and leadership readiness."
  - weak: "Diagnosed and fixed electrical problems"
    improved: "Diagnosed electrical faults using multimeters, amp clamps, and thermal imaging, reducing average repair time by [X%] and maintaining a [X%] first-visit resolution rate"
    reason: "Names the diagnostic tools and frames the work as measurable efficiency, not just a task description; placeholders mark where real figures go."
  - weak: "Followed safety procedures on the job"
    improved: "Maintained [number] years without a safety incident while enforcing PPE requirements and conducting job-site safety briefings for crews of [number]"
    reason: "Converts a passive compliance statement into a verifiable safety track record with crew scope."
  - weak: "Worked on residential and commercial jobs"
    improved: "Completed electrical rough-in for [number]+ new commercial construction projects and [number]+ residential service panel installations ranging 100-400 amps"
    reason: "Replaces a vague scope claim with counted project types and technical specifics (amperage range) that prove depth across both settings."

