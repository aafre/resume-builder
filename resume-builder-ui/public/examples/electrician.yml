customFaqs:
  - question: "Do I need my journeyman license listed on my electrician resume?"
    answer: "Yes, explicitly — state your license level (apprentice, journeyman, or master) and issuing state. Many postings legally require a specific license level to perform certain work, so this is one of the first things a hiring contractor screens for."
  - question: "How do I show electrician experience without exact project numbers?"
    answer: "Estimate from your typical workload — for example, if you completed roughly one residential panel install per week over a year, that's a reasonable annual estimate. A conservative, clearly-scoped number beats no number."
  - question: "What safety information should an electrician put on a resume?"
    answer: "State your safety record directly (e.g., years without an incident), plus any OSHA or NFPA 70E arc-flash training. Commercial and industrial employers treat safety history as a hard screening factor, not a soft skill."
  - question: "Should I mention specific tools like thermal imaging cameras or multimeters?"
    answer: "Yes — naming your diagnostic tools alongside a troubleshooting outcome (e.g., reduced repair time) is stronger evidence than the word \"troubleshooting\" alone, and it matches how employers describe the role in job postings."

